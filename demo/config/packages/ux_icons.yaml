# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons. No default width/height: some UXor recipes
    # (e.g. Avatar:Fallback's icon) size icons through their container.
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

    # Throw an exception if an icon is not
    ignore_not_found: false

    # Every icon the recipes render is committed under assets/icons/. These Flowbite icons were
    # copied from symfony/ux src/Toolkit/tests/Fixtures/icons as reference assets, so the demo
    # never calls the Iconify API: renders are reproducible and a missing icon fails loudly.
    # Add the icons of a new recipe with `php bin/console ux:icons:lock` (on_demand temporarily on)
    # or by copying the SVG.
    iconify:
        on_demand: false
