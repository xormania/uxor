name: PHP analysis comparison
# Each selected push produces its own sample even if the main CI workflow can reuse a previous Kit PHP pass.
on:
    push:
        branches: ['**']
        paths:
            - '**/*.php'
            - '*/manifest.json'
            - demo/config/**
            - demo/composer.json
            - demo/composer.lock
            - tools/sync-demo
            - mago.toml
            - tools/mago
            - packages/uxor/bin/uxor-mago
            - tools/phpstan.neon
            - tools/ci/phpstan/composer.json
            - tools/ci/phpstan/composer.lock
            - tools/ci/php-analysis-*
            - tools/ci/jev-diagnosis.mjs
            - tools/ci/jev-php-analysis.mjs
            - tools/ci/jev-ci.json
            - tools/tests/*php*analysis*
            - tools/tests/fixtures/php-analysis*/**
            - .github/workflows/ci.yml
            - .github/workflows/jev.yml
            - .github/workflows/php-analysis-comparison.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    compare:
        name: PHPStan and Mago
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              id: php
              with:
                  php-version: '8.4'
                  extensions: intl
                  tools: composer:v2
                  coverage: none

            - name: Test the comparison and export formats
              run: python3 -m unittest discover -s tools/tests -p 'test_php_analysis*.py'

            - name: Prepare the same Symfony test container as Kit PHP
              id: demo
              run: |
                  php tools/sync-demo
                  composer install --working-dir=demo --no-interaction --no-progress --no-scripts
                  (cd demo && php bin/console cache:warmup --env=test)

            - name: Install the Kit PHP analyzer and extensions
              id: phpstan
              if: ${{ !cancelled() && steps.php.outcome == 'success' }}
              run: |
                  mkdir -p "$RUNNER_TEMP/phpstan"
                  git show "$GITHUB_SHA:tools/ci/phpstan/composer.json" > "$RUNNER_TEMP/phpstan/composer.json"
                  git show "$GITHUB_SHA:tools/ci/phpstan/composer.lock" > "$RUNNER_TEMP/phpstan/composer.lock"
                  composer install --working-dir="$RUNNER_TEMP/phpstan" --no-interaction --no-progress --no-plugins --no-scripts

            - name: Pull the checkout's pinned Mago image
              id: mago
              if: ${{ !cancelled() && steps.php.outcome == 'success' }}
              run: tools/mago pull

            - name: Compare repository findings
              id: comparison
              if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
              run: |
                  python3 tools/ci/php-analysis-comparison.py --phpstan "$RUNNER_TEMP/phpstan/vendor/bin/phpstan" --out "$RUNNER_TEMP/php-analysis"

            - name: Evaluate known PHP cases
              id: evaluation
              if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
              run: |
                  python3 tools/ci/php-analysis-eval.py --phpstan "$RUNNER_TEMP/phpstan/vendor/bin/phpstan" --out "$RUNNER_TEMP/php-analysis"

            - name: Record the source and collection status
              if: ${{ !cancelled() }}
              env:
                  PHP_SETUP: ${{ steps.php.outcome }}
                  DEMO_SETUP: ${{ steps.demo.outcome }}
                  PHPSTAN_SETUP: ${{ steps.phpstan.outcome }}
                  MAGO_SETUP: ${{ steps.mago.outcome }}
                  COMPARISON: ${{ steps.comparison.outcome }}
                  EVALUATION: ${{ steps.evaluation.outcome }}
              run: |
                  mkdir -p "$RUNNER_TEMP/php-analysis"
                  jq -n '{
                      schema_version: 1, repository: env.GITHUB_REPOSITORY, commit: env.GITHUB_SHA,
                      ref: env.GITHUB_REF, run_id: env.GITHUB_RUN_ID, run_attempt: env.GITHUB_RUN_ATTEMPT,
                      steps: {php: env.PHP_SETUP, demo: env.DEMO_SETUP, phpstan: env.PHPSTAN_SETUP,
                              mago: env.MAGO_SETUP, comparison: env.COMPARISON, evaluation: env.EVALUATION}
                  }' > "$RUNNER_TEMP/php-analysis/run.json"
                  if [ -f "$RUNNER_TEMP/php-analysis/evaluation.json" ]; then
                      jq -r '["Analyzer","True positives","True negatives","Misses","False positives","Bad input errors","Good input errors"],
                          ["---","---","---","---","---","---","---"],
                          (.totals | to_entries[] | [.key,.value.true_positive,.value.true_negative,
                            .value.miss,.value.false_positive,.value.tool_error_bad,.value.tool_error_good])
                          | map(tostring) | join(" | ")' "$RUNNER_TEMP/php-analysis/evaluation.json" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Publish PHP analysis data
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: php-analysis-comparison-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/php-analysis/run.json
                      ${{ runner.temp }}/php-analysis/summary.json
                      ${{ runner.temp }}/php-analysis/findings.jsonl
                      ${{ runner.temp }}/php-analysis/evaluation.json
                  if-no-files-found: error
                  retention-days: 90
