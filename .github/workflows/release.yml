name: Release

# A release pull request moves CHANGELOG.md's Unreleased entries to "## [X.Y.Z] - date" (CONTRIBUTING.md, Releases).
# Once it is merged and CI has passed on main, for each version heading without a GitHub Release, this checks that
# the merge commit that added the heading installs from GitHub in a fresh Symfony Docker project, tags it (unless the
# tag exists and points at that commit), and publishes the Release with the version's section of CHANGELOG.md at that
# commit, then the gallery (pages.yml). tools/release-plan.sh decides the commit, the tag and the notes, and refuses a
# tag that points elsewhere; CI runs it as a dry run. A failed run can be re-run: it picks up where it stopped.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    release:
        name: Tag and publish new versions
        # only after CI passed on a push to main of this repository; a manual run only on main
        if: >-
            github.event_name == 'workflow_run'
            && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && github.event.workflow_run.head_branch == 'main'
            && github.event.workflow_run.head_repository.full_name == github.repository
            || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            versions: ${{ steps.versions.outputs.versions }}
        # one release at a time; on the job, so that the skipped runs (CI on other branches and pull requests) never
        # take the place of a pending one
        concurrency:
            group: release
            cancel-in-progress: false
        permissions:
            contents: write
        steps:
            # pinned by commit: this job can write tags and releases
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # the commit CI passed on (a manual run: main)
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0 # the history and the tags: which commit added a version heading, which tags exist

            - name: Find the versions without a release
              id: versions
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  versions=
                  while read -r version; do
                      gh release view "$version" > /dev/null 2>&1 || versions="$versions $version"
                  done < <(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
                  echo "versions=${versions# }" >> "$GITHUB_OUTPUT"
                  echo "To release: ${versions:- none}"

            # before any install check, tag or release: a tag that points at another commit than the one that adds its
            # heading fails the run here (move or delete the tag by hand, CONTRIBUTING.md, Releases)
            - name: Plan the tags and notes
              if: steps.versions.outputs.versions != ''
              env:
                  VERSIONS: ${{ steps.versions.outputs.versions }}
              run: |
                  # shellcheck disable=SC2086 # the versions, split on spaces
                  tools/release-plan.sh --dry-run $VERSIONS
                  # shellcheck disable=SC2086
                  tools/release-plan.sh --notes-dir "$RUNNER_TEMP/notes" $VERSIONS > "$RUNNER_TEMP/plan"

            - name: Tag, check the install, publish
              if: steps.versions.outputs.versions != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  # the plan on its own descriptor: the install check's commands cannot read it from stdin
                  while read -r -u 3 version commit state; do
                      echo "$version: $state, $(git log -1 --format='%h %s' "$commit")"
                      case "$state" in
                          tagged)
                              # tagged by hand or by an earlier run, on the expected commit: check the tag's install
                              KIT_REF="$version" tools/tests/docker-install.sh
                              ;;
                          untagged)
                              # check the install of the commit from GitHub before any tag makes it a version
                              KIT_REF="$commit" tools/tests/docker-install.sh
                              git tag -a "$version" "$commit" -m "$(jq -r .name manifest.json) $version"
                              git push origin "refs/tags/$version"
                              ;;
                          *) echo "::error::$version: $state"; exit 1 ;;
                      esac
                      gh release create "$version" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes/$version.md"
                  done 3< "$RUNNER_TEMP/plan"

    pages:
        name: Publish the gallery
        needs: release
        if: needs.release.outputs.versions != ''
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/pages.yml
        with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}
