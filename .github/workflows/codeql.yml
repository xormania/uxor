name: CodeQL

# Code scanning of the GitHub Actions workflows (script injection, untrusted checkouts, permissions) and of the
# JavaScript and TypeScript (the Stimulus controllers, kit.js, the Playwright tests). CodeQL does not read Twig or PHP.
# Results: Security › Code scanning, and annotations on pull requests.
on:
    push:
        branches: [main, dev]
    pull_request:
    schedule:
        - cron: '23 5 * * 2'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
            - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  category: /language:${{ matrix.language }}
