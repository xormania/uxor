name: Audit

# Known advisories in both npm projects (repository tests and consumer browser checks), all three Composer
# projects (the package, demo and consumer harness) and the browser packages of the demo's and the consumer's
# importmap.php, which no lock file lists: weekly, as advisories appear without any change
# here, and on every pull request that changes a lockfile or an importmap. On a pull request each audit runs only when its own files
# changed, so an advisory in one ecosystem does not fail a pull request that only touches the other. GitHub runs the
# schedule on the default branch, main: that run only starts the audit on dev (the Start on dev job), so an advisory
# shows on dev, where its fix lands (Dependabot's update pull requests target dev), and main changes only by a release.
on:
    schedule:
        - cron: '17 6 * * 1'
    pull_request:
        paths:
            - package.json
            - package-lock.json
            - packages/uxor/dev/package.json
            - packages/uxor/dev/package-lock.json
            - composer.json
            - composer.lock
            - demo/composer.json
            - demo/composer.lock
            - demo/importmap.php
            - packages/uxor/dev/app/composer.json
            - packages/uxor/dev/app/composer.lock
            - packages/uxor/dev/app/importmap.php
            - .github/workflows/audit.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # The schedule's run, on main: it only starts this workflow on dev (gh workflow run, a workflow_dispatch event, which
    # the job's token may create) and audits nothing, so it cannot fail on an advisory
    start:
        name: Start on dev
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write # start audit.yml on dev
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: gh workflow run audit.yml --repo "$REPO" --ref dev

    npm-audit:
        name: npm audit (${{ matrix.project }})
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 8 # 5 for the job, plus 3 for the advisory collector and its upload
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: tests
                      directory: .
                    - project: consumer
                      directory: packages/uxor/dev
        steps:
            # the pull request's merge commit and its first parent, the base branch
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - id: changed
              if: github.event_name == 'pull_request'
              env:
                  AUDIT_DIRECTORY: ${{ matrix.directory }}
              run: git diff --quiet HEAD^1 HEAD -- "$AUDIT_DIRECTORY/package.json" "$AUDIT_DIRECTORY/package-lock.json" .github/workflows/audit.yml || echo 'files=true' >> "$GITHUB_OUTPUT"

            - name: npm audit
              id: audit
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: ${{ matrix.directory }}
              run: |
                  set -o pipefail
                  npm audit --package-lock-only 2>&1 | tee "$RUNNER_TEMP/jev-audit.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: npm audit (${{ matrix.project }})
                  artifact: jev-input-audit-${{ github.job }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}

    composer-audit:
        name: composer audit (${{ matrix.project }})
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 8 # 5 for the job, plus 3 for the advisory collector and its upload
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: package
                      directory: .
                    - project: demo
                      directory: demo
                    - project: consumer
                      directory: packages/uxor/dev/app
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - id: changed
              if: github.event_name == 'pull_request'
              env:
                  AUDIT_DIRECTORY: ${{ matrix.directory }}
              run: git diff --quiet HEAD^1 HEAD -- "$AUDIT_DIRECTORY/composer.json" "$AUDIT_DIRECTORY/composer.lock" .github/workflows/audit.yml || echo 'files=true' >> "$GITHUB_OUTPUT"

            - if: github.event_name != 'pull_request' || steps.changed.outputs.files
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            # the lock file only: nothing is installed
            - name: composer audit
              id: audit
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: ${{ matrix.directory }}
              run: |
                  set -o pipefail
                  composer audit --locked 2>&1 | tee "$RUNNER_TEMP/jev-audit.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: composer audit (${{ matrix.project }})
                  artifact: jev-input-audit-${{ github.job }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The browser packages an importmap.php selects (AssetMapper downloads them from npm): no lock file lists them, so
    # composer audit cannot see them. The audit fails the lane on an advisory; a newer version is not one, so
    # importmap:outdated only reports. Dependencies are installed without scripts: they would download every package.
    importmap-audit:
        name: importmap audit (${{ matrix.project }})
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 8 # 5 for the job, plus 3 for the advisory collector and its upload
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: demo
                      directory: demo
                    - project: consumer
                      directory: packages/uxor/dev/app
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - id: changed
              if: github.event_name == 'pull_request'
              env:
                  AUDIT_DIRECTORY: ${{ matrix.directory }}
              run: git diff --quiet HEAD^1 HEAD -- "$AUDIT_DIRECTORY/importmap.php" "$AUDIT_DIRECTORY/composer.json" "$AUDIT_DIRECTORY/composer.lock" .github/workflows/audit.yml || echo 'files=true' >> "$GITHUB_OUTPUT"

            - if: github.event_name != 'pull_request' || steps.changed.outputs.files
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
                  extensions: intl, mbstring, pdo_sqlite, zip # the demo's and the consumer application's

            # bin/console needs vendor/: the consumer installs the package from the repository root (a path repository)
            - name: Install the dependencies
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: ${{ matrix.directory }}
              run: composer install --no-interaction --no-progress --no-scripts

            - name: List the packages and versions checked
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: ${{ matrix.directory }}
              run: |
                  # shellcheck disable=SC2016 # the dollar signs are PHP's
                  php -r '$importmap = require "importmap.php"; foreach ($importmap as $name => $entry) { if (isset($entry["version"])) { echo $name, " ", $entry["version"], "\n"; } }'

            # the advisory request goes with the job's token, which lifts GitHub's anonymous rate limit: a config written
            # for this step only (never committed, removed when the step ends, before outdated runs without the variable)
            # points AssetMapper's client at one that adds the header for api.github.com alone; the file holds the env
            # reference, never the token; without a token the request stays anonymous
            - name: importmap audit
              id: audit
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: ${{ matrix.directory }}
              env:
                  AUDIT_GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  if [ -n "${AUDIT_GITHUB_TOKEN:-}" ]; then
                      trap 'rm -f config/packages/zz_audit_github.yaml' EXIT
                      cat > config/packages/zz_audit_github.yaml <<'YAML'
                  framework:
                      http_client:
                          scoped_clients:
                              audit_github.client:
                                  scope: '^https://api\.github\.com/'
                                  headers:
                                      Authorization: 'Bearer %env(AUDIT_GITHUB_TOKEN)%'
                  services:
                      asset_mapper.http_client:
                          alias: audit_github.client
                  YAML
                  fi
                  bin/console importmap:audit 2>&1 | tee "$RUNNER_TEMP/jev-audit.log"

            # newer versions are reported, never a failure, and leave a notice, not an error annotation: the command exits
            # 1 both when something is outdated and when it cannot check, so its JSON on stdout tells the two apart (an
            # error goes to stderr and leaves no JSON list); a check that could not be made leaves a warning
            - name: importmap outdated
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              continue-on-error: true
              working-directory: ${{ matrix.directory }}
              run: |
                  status=0
                  bin/console importmap:outdated --format=json > "$RUNNER_TEMP/outdated.json" || status=$?
                  if [ "$status" -eq 0 ]; then
                      echo "No newer versions."
                  elif count="$(jq -er 'if type == "array" and length > 0 then length else error("no list") end' "$RUNNER_TEMP/outdated.json" 2>/dev/null)"; then
                      jq -r '.[] | "\(.name) \(.current) -> \(.latest) (\(.["latest-status"]))"' "$RUNNER_TEMP/outdated.json"
                      echo "::notice::importmap:outdated: $count packages have newer versions, listed above (a newer version is not an advisory)"
                  else
                      cat "$RUNNER_TEMP/outdated.json"
                      echo "::warning::importmap:outdated could not check for newer versions (exit $status, error above): nothing is known about them"
                  fi

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: importmap audit (${{ matrix.project }})
                  artifact: jev-input-audit-${{ github.job }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
