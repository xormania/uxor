name: Audit

# Known advisories in the locked npm packages of the Playwright tests and the demo's locked Composer packages (the
# Symfony and UX packages the recipes install, and the PHP test tools): weekly, as advisories appear without any change
# here, and on every pull request that changes a lockfile. On a pull request each audit runs only when its own files
# changed, so an advisory in one ecosystem does not fail a pull request that only touches the other.
on:
    schedule:
        - cron: '17 6 * * 1'
    pull_request:
        paths: [package.json, package-lock.json, demo/composer.json, demo/composer.lock, .github/workflows/audit.yml]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    npm-audit:
        name: npm audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # the pull request's merge commit and its first parent, the base branch
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - id: changed
              if: github.event_name == 'pull_request'
              run: git diff --quiet HEAD^1 HEAD -- package.json package-lock.json .github/workflows/audit.yml || echo 'files=true' >> "$GITHUB_OUTPUT"

            - name: npm audit
              id: audit
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              run: |
                  set -o pipefail
                  npm audit --package-lock-only 2>&1 | tee "$RUNNER_TEMP/jev-audit.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: npm audit
                  artifact: jev-input-audit-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    composer-audit:
        name: composer audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - id: changed
              if: github.event_name == 'pull_request'
              run: git diff --quiet HEAD^1 HEAD -- demo/composer.json demo/composer.lock .github/workflows/audit.yml || echo 'files=true' >> "$GITHUB_OUTPUT"

            - if: github.event_name != 'pull_request' || steps.changed.outputs.files
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            # the lock file only: nothing is installed
            - name: composer audit
              id: audit
              if: github.event_name != 'pull_request' || steps.changed.outputs.files
              working-directory: demo
              run: |
                  set -o pipefail
                  composer audit --locked 2>&1 | tee "$RUNNER_TEMP/jev-audit.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: composer audit
                  artifact: jev-input-audit-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The advisory Jev diagnosis of what the jobs above collected (.github/actions/jev-diagnosis): in a job of its own,
    # the only one given the key, running the trusted branch's tools/ci (.github/workflows/jev.yml). Nothing waits for it.
    jev:
        name: Jev
        needs: [npm-audit, composer-audit]
        if: ${{ !cancelled() }}
        permissions:
            contents: read
        uses: ./.github/workflows/jev.yml
        with:
            workflow: audit
        secrets:
            TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
