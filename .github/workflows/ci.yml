name: CI
# an engines-only run (Release checks' Start the engines, or by hand) is named so that Start the engines can find one already
# queued or running for a head; every other run keeps GitHub's own name (the commit's title, or the workflow's)
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.engines_only && 'CI: Firefox and WebKit only' || '' }}"

# Every push to a branch runs CI, so a branch is green before its PR opens; there is no pull_request trigger, whose
# runs would duplicate every check (skipped) on the same commit, and a skipped CI result passes the rulesets before the
# push's own run ends. A fork's pull request gets CI once its branch is pushed here. Tag pushes do not run it:
# release.yml checks a release's install before tagging it. Actions are pinned by commit; Dependabot proposes their updates
# (.github/dependabot.yml). Once a day the install jobs that resolve consumer dependencies afresh run alone, on dev
# (the Changes job): a new Symfony skeleton or Symfony Docker, the consumer's packages from Packagist, which a dev push that touches
# no install may no longer run. GitHub runs a schedule on the default branch, main: that run only starts the daily run
# on dev (the Start on dev job), so a failure shows on dev, where its fix lands, and main changes only by a release.
on:
    push:
        branches: ['**']
    schedule:
        - cron: '29 5 * * *'
    workflow_dispatch:
        inputs:
            daily:
                description: 'On dev only, the daily run: install checks with fresh consumer dependency resolution (what the schedule starts)'
                type: boolean
                default: false
            engines:
                description: 'Run the browser tests in Firefox and WebKit too (on a push they wait for dev''s daily run: docs/TESTING.md, *Browsers*)'
                type: boolean
                default: false
            engines_only:
                description: 'Run only the Firefox and WebKit browser tests, for this head (what Release checks starts); its result is CI result (engines only)'
                type: boolean
                default: false
            reuse:
                description: 'Reuse an earlier pass of a lane whose inputs are unchanged (docs/TESTING.md, *Reused lanes*); off runs every selected lane fresh'
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    # the schedule's start, the daily run and an engines-only run in groups of their own: none cancels, or is cancelled by,
    # a push; an engines-only run never cancels another (a second one waits)
    group: ${{ github.event_name == 'schedule' && 'ci-schedule' || inputs.daily && github.ref == 'refs/heads/dev' && 'ci-daily' || inputs.engines_only && format('ci-engines-{0}', github.ref) || format('ci-{0}', github.ref) }}
    cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.engines_only) }}

env:
    PHP_VERSION: '8.4'
    # The minimum supported Symfony UX Toolkit: the kit must keep linting and installing with it. Lint kit's other lane
    # takes the newest version the demo runs, read at run time; the fresh installs use this one.
    UX_TOOLKIT_MINIMUM_VERSION: '3.5.1'
    # The browser tests (docs/TESTING.md, *Browsers*): Chromium in CHROMIUM_SHARDS shards on every push that selects them;
    # Firefox and WebKit, three shards each, as ENGINES_ON says. `daily` (the trial): on dev's daily run when dev changed
    # since their last pass, on main, when a manual run asks for them (the `engines` input), and for the release pull
    # request, whose Release checks starts them when its head has no pass; any other push defers them, said so in CI
    # result. `every-push`: on every push, as before the trial. This line is the one switch back.
    # eight, measured: 4 min 35 s to CI result against 5 min 37 s with six, for the same test seconds
    CHROMIUM_SHARDS: '8'
    ENGINES_ON: daily

jobs:
    # The schedule's run, on main: it only starts the daily run on dev (gh workflow run, a workflow_dispatch event, which
    # the job's token may create) and runs nothing else, so it cannot fail on what the daily run finds
    start:
        name: Start on dev
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write # start ci.yml on dev
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: gh workflow run ci.yml --repo "$REPO" --ref dev -f daily=true

    # Which jobs this change could affect (tools/ci-changes.sh): a job it cannot affect is skipped, and a skipped job
    # passes the branch rulesets. Pushes to main, a run by hand and a change to this workflow run everything. A branch
    # is compared with where it left dev, so each push checks the whole pull request, not only its last commit. A push to
    # dev is compared with the commit of dev's last successful run, so every merge since is checked, those of a run that
    # was cancelled or failed included; with none (a first run, a force push), everything runs. The daily run runs the
    # installs only. A work order's own branch (claude/wo-<name>) runs like any branch, its pull request a draft or not:
    # when its jobs are stacked, its tree after a job's merge is that job's, whose passes it reuses (CONTRIBUTING.md,
    # *Work orders*).
    changes:
        name: Changes
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 8 # 5 for the job, plus 3 for the advisory collector and its upload
        permissions:
            contents: read
            actions: read # the shard timings of dev's last green run
        outputs:
            timings: ${{ steps.timings.outputs.artifact }}
            # each lane: run, reuse (an earlier pass with the same inputs) or skip (the change cannot affect it)
            lint-kit: ${{ steps.plan.outputs.lint-kit }}
            php: ${{ steps.plan.outputs.php }}
            static-site: ${{ steps.plan.outputs.static-site }}
            fresh-install: ${{ steps.plan.outputs.fresh-install }}
            contrast: ${{ steps.plan.outputs.contrast }}
            demo: ${{ steps.plan.outputs.demo }}
            workflows: ${{ steps.plan.outputs.workflows }}
            package: ${{ steps.plan.outputs.package }}
            prod-image: ${{ steps.plan.outputs.prod-image }}
            importmap: ${{ steps.plan.outputs.importmap }}
            # the browser job: Firefox and WebKit (run, reuse, defer or skip), whether it runs, and its computed matrix
            engines: ${{ steps.plan.outputs.engines }}
            browsers: ${{ steps.plan.outputs.browsers }}
            browser-matrix: ${{ steps.plan.outputs.browser-matrix }}
            # the plan's artifact, named once: a re-run of failed jobs keeps this job's outputs and reads the same plan
            lane-plan: ${{ steps.plan.outputs.artifact }}
            # the plan's artifact by id and its plan.json's SHA-256: CI result takes nothing else from it, and checks both
            lane-plan-id: ${{ steps.plan-upload.outputs.artifact-id }}
            lane-plan-sha256: ${{ steps.plan.outputs.sha256 }}
            base: ${{ steps.jobs.outputs.base }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The script's own cases
              id: cases
              run: |
                  set -o pipefail
                  tools/tests/ci-changes.sh 2>&1 | tee "$RUNNER_TEMP/jev-cases.log"

            - id: jobs
              env:
                  EVENT: ${{ github.event_name }}
                  DAILY: ${{ inputs.daily }}
                  ENGINES_ONLY: ${{ inputs.engines_only }}
                  REF: ${{ github.ref }}
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  # Where the branch left dev; none for main, dev or a run by hand. Computed here, in the workflow, not by a
                  # script in the tree: a branch cannot choose the range it is checked against. Contrast reads the same
                  # range (tools/readme-pairing.mjs --base).
                  if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/dev ]; then
                      base=$(git merge-base HEAD origin/dev 2>/dev/null || true)
                  else
                      base=
                  fi
                  echo "base=$base" >> "$GITHUB_OUTPUT"
                  # dev: the commit of its last successful push run (dev changes only through reviewed pull requests, and
                  # only a commit dev's history holds counts). Only for the jobs: Contrast's README pairing keeps no base
                  from=$base
                  if [ "$EVENT" = push ] && [ "$REF" = refs/heads/dev ]; then
                      green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=dev&event=push&status=success&per_page=10" \
                          --jq ".workflow_runs[] | select(.head_repository.full_name == \"$REPO\") | .head_sha" 2>/dev/null | head -n1 || true)
                      if [ -n "$green" ] && git merge-base --is-ancestor "$green" HEAD 2>/dev/null; then
                          from=$green
                      fi
                  fi
                  # The classifier runs as it is at the base, which the change cannot edit: a branch that changes
                  # tools/ci-changes.sh is classified by the base's copy (which runs everything for that path), and a base
                  # without the script runs everything.
                  # the daily run on dev only: elsewhere `daily` is ignored and everything runs, so a dispatch on a
                  # branch cannot pass CI result with its checks skipped
                  if [ "$EVENT" = workflow_dispatch ] && [ "$ENGINES_ONLY" = true ]; then
                      # Firefox and WebKit only, for the release pull request's head (Release checks) or by hand: every
                      # other lane already has its result on this head's push run
                      echo "Firefox and WebKit only"
                      for job in lint-kit php static-site fresh-install contrast demo workflows package prod-image; do
                          echo "$job=false"
                      done > "$RUNNER_TEMP/jobs"
                      echo "engines=true" >> "$RUNNER_TEMP/jobs"
                  elif [ "$EVENT" = workflow_dispatch ] && [ "$DAILY" = true ] && [ "$REF" = refs/heads/dev ]; then
                      echo "The daily run: install checks with fresh consumer dependency resolution"
                      for job in lint-kit php static-site fresh-install contrast demo workflows package prod-image; do
                          case "$job" in fresh-install | package) echo "$job=true" ;; *) echo "$job=false" ;; esac
                      done > "$RUNNER_TEMP/jobs"
                      # and Firefox and WebKit, unless they already passed on dev's inputs (the plan)
                      echo "engines=true" >> "$RUNNER_TEMP/jobs"
                  elif [ -n "$from" ] && git show "$from:tools/ci-changes.sh" > "$RUNNER_TEMP/ci-changes.sh" 2>/dev/null; then
                      echo "Changed since $from:"
                      git diff --name-only --no-renames "$from" HEAD | tee /dev/stderr | bash "$RUNNER_TEMP/ci-changes.sh" > "$RUNNER_TEMP/jobs"
                  else
                      echo "Everything runs ($EVENT on $REF)"
                      : > "$RUNNER_TEMP/jobs"
                  fi
                  # a job the base's classifier does not know (one this branch adds) runs
                  for job in lint-kit php static-site fresh-install contrast demo workflows package prod-image; do
                      grep -q "^$job=" "$RUNNER_TEMP/jobs" || echo "$job=true" >> "$RUNNER_TEMP/jobs"
                  done
                  cat "$RUNNER_TEMP/jobs"

            # The browser tests are two lanes of one job: the Chromium shards (demo) and Firefox and WebKit (engines), which
            # with ENGINES_ON=daily wait on a push (defer: NOT RUN AT THIS STAGE in CI result) and run on the daily run
            # (unless they passed on these inputs), on main and when a manual run asks; the plan writes the job's matrix.
            # Each selected lane runs, or reuses an earlier pass with the same inputs (tools/ci/lane-evidence.mjs,
            # docs/TESTING.md, *Reused lanes*): the markers for the lane's fingerprint, newest first, until a failure from
            # a verified producer (which runs the lane) or a pass that verifies: at most 14 days old, recorded by CI result
            # of a push or manual ci.yml run of this repository whose lane jobs all passed in their latest attempt, the
            # fingerprint recomputed at that run's commit this one's. Never on main; off with the repository variable
            # CI_REUSE=off or a manual run's `reuse` unchecked (both only stop the lookups: the run still records its
            # markers). A lookup that fails runs the lane.
            # This runs the branch's own copy of the tool, unlike the selector above, which runs as the base has it: the
            # selector decides from the diff what a change can affect, so a branch could skip its own checks by editing
            # it. The tool and ci.yml are inside every fingerprint, so a branch's own copy can only match a pass recorded
            # by that same copy and workflow, and a push already runs the branch's own ci.yml.
            - name: Plan the lanes
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  REF: ${{ github.ref }}
                  REUSE: ${{ (vars.CI_REUSE == 'off' || (github.event_name == 'workflow_dispatch' && !inputs.reuse)) && 'off' || 'on' }}
                  ARTIFACT: lane-plan-${{ github.run_id }}-${{ github.run_attempt }}
                  ENGINES: ${{ inputs.engines && 'true' || 'false' }}
                  PLAN_EVENT: ${{ github.event_name == 'workflow_dispatch' && (inputs.engines_only && 'engines' || inputs.daily && github.ref == 'refs/heads/dev' && 'daily' || 'dispatch') || 'push' }}
              run: |
                  echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
                  mkdir -p "$RUNNER_TEMP/lane-plan"
                  node tools/ci/lane-evidence.mjs plan --repo "$REPO" --sha "$SHA" --ref "$REF" --reuse "$REUSE" \
                      --event "$PLAN_EVENT" --engines-on "$ENGINES_ON" --engines "$ENGINES" --chromium-shards "$CHROMIUM_SHARDS" \
                      --selection "$RUNNER_TEMP/jobs" --out "$RUNNER_TEMP/lane-plan/plan.json" --github-output "$GITHUB_OUTPUT"
                  echo "sha256=$(sha256sum "$RUNNER_TEMP/lane-plan/plan.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
                  jq -r '"Lanes planned in \(.elapsed_ms) ms, \(.api_calls) API calls"' "$RUNNER_TEMP/lane-plan/plan.json" >> "$GITHUB_STEP_SUMMARY"

            # the plan alone, for CI result's record and verdict (which run the tool of the run's own commit, never a copy
            # from an artifact: another job of the run could replace an artifact of a predictable name)
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              id: plan-upload
              with:
                  name: ${{ steps.plan.outputs.artifact }}
                  path: ${{ runner.temp }}/lane-plan/plan.json
                  if-no-files-found: error
                  retention-days: 7

            # The browser shards' timings, read once for the whole run so every shard plans from the same file: the
            # shard-timings.json of dev's last green run (its ci-metrics artifact, written by the CI metrics job), else the
            # committed tests/shard-timings.json. A file that is not schema 1 with a time in ms for every test is not
            # used. dev changes only through reviewed pull requests; the times only balance the shards, and every
            # shard's plan still checks that it runs each listed test once (docs/TESTING.md, *Shard balance*)
            - name: Shard timings
              id: timings
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  ARTIFACT: shard-timings-${{ github.run_id }}-${{ github.run_attempt }}
              run: |
                  out="$RUNNER_TEMP/shard-timings"
                  mkdir -p "$out"
                  cp tests/shard-timings.json "$out/shard-timings.json"
                  source="the committed tests/shard-timings.json"
                  # any event, not pushes only: dev's daily and engines-only runs are the ones that run Firefox and WebKit,
                  # and each run's file carries every browser's newest times forward
                  run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=dev&status=success&per_page=5" \
                      --jq ".workflow_runs[] | select(.head_repository.full_name == \"$REPO\") | .id" 2>/dev/null | head -n1 || true)
                  if [ -n "$run" ]; then
                      artifact=$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                          --jq '.artifacts[] | select(.name | startswith("ci-metrics-")) | select(.expired | not) | .id' 2>/dev/null | head -n1 || true)
                      if [ -n "$artifact" ] && gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/ci-metrics.zip" 2>/dev/null \
                          && unzip -p "$RUNNER_TEMP/ci-metrics.zip" shard-timings.json > "$RUNNER_TEMP/candidate.json" 2>/dev/null \
                          && node -e '
                              const t = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                              const times = Object.values(t.tests ?? {});
                              if (t.schema !== 1 || times.length === 0 || !times.every((v) => Number.isFinite(v) && v >= 0)) process.exit(1);
                          ' "$RUNNER_TEMP/candidate.json"; then
                          cp "$RUNNER_TEMP/candidate.json" "$out/shard-timings.json"
                          source="dev's run $run"
                      fi
                  fi
                  echo "Shard timings: $source"
                  echo "Shard timings: $source" >> "$GITHUB_STEP_SUMMARY"
                  echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: shard-timings-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/shard-timings/shard-timings.json
                  if-no-files-found: error
                  retention-days: 7

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Changes
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Quick checks: the short checks of three former jobs, as steps of one job (one runner, one admission, one setup):
    #
    # - Tool tests, on every run: every tool's own cases (tools/tests/*.test.mjs and tools/monthly/*.test.mjs; Node
    #   built-ins only, no install, a few seconds; no browser job runs them again; Node's JUnit report, beside the
    #   console's TAP, gives Jev each failed case), the repository security policy (the workflows, executable sinks,
    #   tracked paths and ownership controls), and what any path can break whichever lanes the change runs: the bundled
    #   references' links, the test inventory's names, the archive's payload, and the name check, which reads every file.
    # - Contrast, when tools/ci-changes.sh selects it: the theme's contrast, kit.css, llms.txt, what the markdown
    #   teaches, the icons, the README examples, the test inventory, the READMEs' versions and the README pairing (which
    #   reads the branch's commits since the Changes job's base).
    # - Workflows, when selected: every workflow's syntax, expressions, job graph, action inputs and the shell of its run
    #   steps (actionlint with ShellCheck, release binaries pinned by version and SHA-256); tools/ci-changes.sh also runs
    #   the jobs that run what a workflow runs (pages.yml: Static site; release.yml: Fresh install and Static site). Then
    #   release.yml's decision, as a dry run: tools/release-plan.sh's cases, and its plan for main as it is.
    #
    # Every check is a step whose id names its check (tools-, contrast-, workflows-) and runs whatever another did
    # (`!cancelled()`), so a failure never hides the rest. The summary then writes each check's outcome (success, failure,
    # skipped when not selected, incomplete when a selected step did not run) to the job's outputs, which CI result reads
    # per lane, and to the summary page, and fails the job when a selected check did not pass. (Each check's output also
    # goes to $RUNNER_TEMP/jev-<id>.log, for the Jev step: tools/ci/step-attempts.mjs.)
    quick:
        name: Quick checks
        needs: changes
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 15 # the three checks' 5, 10 and 5 in a row, plus 3 for the advisory Jev steps
        env:
            ACTIONLINT_VERSION: '1.7.12'
            ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # actionlint_1.7.12_linux_amd64.tar.gz
            SHELLCHECK_VERSION: '0.11.0'
            SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 # shellcheck-v0.11.0.linux.x86_64.tar.xz
        outputs:
            tools: ${{ steps.summary.outputs.tools }}
            contrast: ${{ steps.summary.outputs.contrast }}
            workflows: ${{ steps.summary.outputs.workflows }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0 # the README pairing reads the branch's commits since its base, the release dry run main's history and tags


            # the setups have ids so the summary counts them: a check that ran after a failed setup, on the image's own
            # Node or PHP, is no pass
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              id: setup-node
              with:
                  node-version: 22
                  cache: npm


            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              id: setup-php
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none

            # Workflows ------------------------------------------------------------------------------------------------
            # first, before any step runs repository code: nothing can have rewritten the workflows or the release plan,
            # and the release dry run comes before the plan's own cases

            # The committed tree, before these checks: a tracked file that differs from HEAD on disk (rewritten by an earlier
            # step's repository code) would let them check a file the commit does not hold
            - name: The tracked files are the commit's
              id: workflows-guard
              if: ${{ !cancelled() && needs.changes.outputs.workflows == 'run' }}
              run: |
                  changed=$(git status --porcelain --untracked-files=no)
                  if [ -n "$changed" ] || ! git diff --quiet HEAD --; then
                      echo "::error::tracked files differ from the commit before these checks: $(echo "$changed" | awk '{print $NF}' | tr '\n' ' ')"
                      exit 1
                  fi


            - name: Install actionlint and ShellCheck
              id: workflows-install
              if: ${{ !cancelled() && needs.changes.outputs.workflows == 'run' }}
              working-directory: ${{ runner.temp }}
              run: |
                  curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
                  printf '%s  %s\n' "$ACTIONLINT_SHA256" actionlint.tar.gz "$SHELLCHECK_SHA256" shellcheck.tar.xz | sha256sum --check --strict
                  mkdir bin
                  tar -xzf actionlint.tar.gz -C bin actionlint
                  tar -xJf shellcheck.tar.xz -C bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"


            # the runner's own ShellCheck and Python are not used: only the pinned tools decide
            - name: actionlint
              id: workflows-actionlint
              if: ${{ !cancelled() && needs.changes.outputs.workflows == 'run' }}
              run: |
                  set -o pipefail
                  "$RUNNER_TEMP/bin/actionlint" -shellcheck="$RUNNER_TEMP/bin/shellcheck" -pyflakes= 2>&1 | tee "$RUNNER_TEMP/jev-workflows-actionlint.log"


            # what release.yml would tag and publish from main, with this commit's script; it creates nothing
            - name: Release dry run on main
              id: workflows-dry-run
              if: ${{ !cancelled() && needs.changes.outputs.workflows == 'run' }}
              run: |
                  set -o pipefail
                  tools/release-plan.sh --dry-run --ref origin/main 2>&1 | tee "$RUNNER_TEMP/jev-workflows-dry-run.log"


            - name: The release plan's own cases
              id: workflows-release-plan
              if: ${{ !cancelled() && needs.changes.outputs.workflows == 'run' }}
              run: |
                  set -o pipefail
                  tools/tests/release-plan.sh 2>&1 | tee "$RUNNER_TEMP/jev-workflows-release-plan.log"


            # Tool tests -----------------------------------------------------------------------------------------------
            # the file checks on the committed tree first, then the tools' own cases (repository code)

            # The committed tree, before these checks: a tracked file that differs from HEAD on disk (rewritten by an earlier
            # step's repository code) would let them check a file the commit does not hold
            - name: The tracked files are the commit's
              id: tools-guard
              if: ${{ !cancelled() }}
              run: |
                  changed=$(git status --porcelain --untracked-files=no)
                  if [ -n "$changed" ] || ! git diff --quiet HEAD --; then
                      echo "::error::tracked files differ from the commit before these checks: $(echo "$changed" | awk '{print $NF}' | tr '\n' ' ')"
                      exit 1
                  fi


            - name: Repository security policy
              id: tools-policy
              if: ${{ !cancelled() }}
              run: node tools/security-policy.mjs


            - name: The bundled references are up to date
              id: tools-references
              if: ${{ !cancelled() }}
              run: php packages/uxor/tools/generate-reference.php --check


            - name: The test inventory names existing tests
              id: tools-inventory
              if: ${{ !cancelled() }}
              run: node tools/test-inventory.mjs


            - name: The archive holds what the kit and the package declare
              id: tools-archive
              if: ${{ !cancelled() }}
              run: python3 packages/uxor/tools/check-package.py


            - name: Every URL of the kit's repository is manifest.json's homepage
              id: tools-names
              if: ${{ !cancelled() }}
              run: node tools/name-check.mjs


            - name: The tools' own cases
              id: tools-cases
              if: ${{ !cancelled() }}
              run: >-
                  node --test --test-reporter=tap --test-reporter-destination=stdout
                  --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/node-tests.xml"
                  'tools/tests/*.test.mjs' 'tools/monthly/*.test.mjs'


            # Advisory diagnosis of each failed case (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis of the tools' cases (advisory)
              if: ${{ failure() && steps.tools-cases.outcome == 'failure' }}
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  junit: ${{ runner.temp }}/node-tests.xml
                  junit-project: node
                  job: Quick checks
                  artifact: jev-input-ci-${{ github.job }}-cases-${{ github.run_id }}-${{ github.run_attempt }}


            # Contrast -------------------------------------------------------------------------------------------------

            # The committed tree, before these checks: a tracked file that differs from HEAD on disk (rewritten by an earlier
            # step's repository code) would let them check a file the commit does not hold
            - name: The tracked files are the commit's
              id: contrast-guard
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  changed=$(git status --porcelain --untracked-files=no)
                  if [ -n "$changed" ] || ! git diff --quiet HEAD --; then
                      echo "::error::tracked files differ from the commit before these checks: $(echo "$changed" | awk '{print $NF}' | tr '\n' ' ')"
                      exit 1
                  fi


            - name: Install the Contrast tools' packages
              id: contrast-npm
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: npm ci


            - name: Token contrast (tools/contrast/pairs.json, both themes)
              id: contrast-tokens
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/contrast/check.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-tokens.log"


            - name: The theme recipe ships kit.css unchanged
              id: contrast-theme-css
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  cmp kit.css theme/assets/styles/uxor.css 2>&1 | tee "$RUNNER_TEMP/jev-contrast-theme-css.log"


            - name: llms.txt matches docs/RECIPES.md's recipe tables
              id: contrast-llms
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/llms-txt.mjs --check 2>&1 | tee "$RUNNER_TEMP/jev-contrast-llms.log"


            - name: The markdown teaches no Flowbite JS, palette color, inline handler or style
              id: contrast-docs-lint
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/docs-lint.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-docs-lint.log"


            - name: Icons are flowbite names written in full, in the recipes' templates and the markdown
              id: contrast-icons
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/icon-lint.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-icons.log"


            - name: Every README example is one the demo reads
              id: contrast-fences
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/fence-coverage.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-fences.log"


            - name: The test inventory has a row per recipe with a controller and names existing tests; a11y scans every lab page
              id: contrast-inventory
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/test-inventory.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-inventory.log"


            - name: Each recipe README renders its manifest's dependencies and writes no version table
              id: contrast-readme-versions
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              run: |
                  set -o pipefail
                  node tools/readme-versions.mjs 2>&1 | tee "$RUNNER_TEMP/jev-contrast-readme-versions.log"


            # The Changes job's base: none for main, dev or a run by hand, which compares nothing
            - name: A recipe whose code changed has its README changed, or a Docs-waiver trailer
              id: contrast-readme-pairing
              if: ${{ !cancelled() && needs.changes.outputs.contrast == 'run' }}
              env:
                  BASE: ${{ needs.changes.outputs.base }}
              run: |
                  set -o pipefail
                  node tools/readme-pairing.mjs --base "$BASE" 2>&1 | tee "$RUNNER_TEMP/jev-contrast-readme-pairing.log"


            # Advisory diagnosis of the steps that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Quick checks
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}


            # Each check's outcome, from its steps: the job's outputs (CI result reads them per lane) and the summary page
            - name: Summary
              id: summary
              if: ${{ always() }}
              env:
                  STEPS: ${{ toJSON(steps) }}
                  CONTRAST: ${{ needs.changes.outputs.contrast }}
                  WORKFLOWS: ${{ needs.changes.outputs.workflows }}
              run: |
                  status=0
                  # a setup that did not succeed leaves every selected check incomplete, whatever its steps said
                  setup=$(jq -r '[to_entries[] | select(.key | startswith("setup-")) | select(.value.outcome != "success") | .key] | join(", ")' <<< "$STEPS")
                  printf '### Quick checks\n\n| Check | Result | Steps |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
                  for lane in tools contrast workflows; do
                      case "$lane" in
                          tools) label='Tool tests'; selected=run ;;
                          contrast) label=Contrast; selected=$CONTRAST ;;
                          workflows) label=Workflows; selected=$WORKFLOWS ;;
                      esac
                      steps=''
                      if [ "$selected" != run ]; then
                          outcome=skipped
                      else
                          pick() { jq -r --arg p "$lane-" "[to_entries[] | select(.key | startswith(\$p)) | $1 | .key] | join(\", \")" <<< "$STEPS"; }
                          failed=$(pick 'select(.value.outcome == "failure")')
                          missing=$(pick 'select(.value.outcome != "success" and .value.outcome != "failure")')
                          ran=$(pick 'select(.value.outcome == "success" or .value.outcome == "failure")')
                          if [ -n "$setup" ]; then
                              outcome=incomplete; steps="setup: $setup"
                              echo "::error::$label: the setup did not succeed ($setup), so its checks ran on the image's own tools"
                          elif [ -n "$failed" ]; then
                              outcome=failure; steps=$failed
                              echo "::error::$label: $failed failed"
                          elif [ -n "$missing" ] || [ -z "$ran" ]; then
                              outcome=incomplete; steps=${missing:-none ran}
                              echo "::error::$label: $steps did not run"
                          else
                              outcome=success
                          fi
                      fi
                      echo "$lane=$outcome" >> "$GITHUB_OUTPUT"
                      echo "| $label | $outcome | $steps |" >> "$GITHUB_STEP_SUMMARY"
                      case "$outcome" in success | skipped) ;; *) status=1 ;; esac
                  done
                  exit "$status"

    # Two lanes: the Toolkit version the demo locks (what the kit is developed with) and the minimum supported one

    lint-kit:
        name: Lint kit (${{ matrix.toolkit }} toolkit)
        needs: changes
        if: needs.changes.outputs.lint-kit == 'run'
        strategy:
            fail-fast: false
            matrix:
                toolkit: [locked, minimum]
        runs-on: ubuntu-latest
        timeout-minutes: 13 # 10, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer:v2
                  coverage: none

            # read at run time, so the lane follows each update of the demo's lock without an edit here
            - name: Read the Toolkit version demo/composer.lock holds
              id: locked
              if: matrix.toolkit == 'locked'
              run: |
                  version="$(jq -r '[.packages[], (.["packages-dev"] // [])[]] | map(select(.name == "symfony/ux-toolkit"))[0].version // empty' demo/composer.lock)"
                  if [ -z "$version" ]; then echo "::error::demo/composer.lock holds no symfony/ux-toolkit"; exit 1; fi
                  echo "Toolkit locked by the demo: $version"
                  echo "version=${version#v}" >> "$GITHUB_OUTPUT"

            - name: Install the locked symfony/ux-toolkit in a scratch directory
              if: matrix.toolkit == 'locked'
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir toolkit && cd toolkit
                  composer require --no-interaction --no-progress --dev "symfony/ux-toolkit:${{ steps.locked.outputs.version }}"

            - name: Install the minimum symfony/ux-toolkit in a scratch directory
              if: matrix.toolkit == 'minimum'
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir toolkit && cd toolkit
                  composer require --no-interaction --no-progress --dev "symfony/ux-toolkit:${UX_TOOLKIT_MINIMUM_VERSION}"

            # ux-toolkit-kit-lint reports every top-level directory without a manifest.json as an error
            # (demo/, tools/, .github/…), so lint the tree `ux:install` actually downloads: GitHub's
            # archive honors .gitattributes export-ignore exactly like `git archive`. The same archive is the Composer
            # package xormania/uxor (composer.json, packages/uxor/): its runtime and agent files are in it, its
            # development files are not (the Package job checks the whole payload).
            - name: Export the kit as GitHub's archive would
              run: |
                  mkdir "$RUNNER_TEMP/kit"
                  git archive HEAD | tar -x -C "$RUNNER_TEMP/kit"
                  echo "Exported:" && ls -A "$RUNNER_TEMP/kit"
                  for path in demo docs tests tools .github .xorder package.json package-lock.json playwright.config.ts alert/tests \
                      composer.lock packages/uxor/tests packages/uxor/tools packages/uxor/dev packages/uxor/phpunit.xml.dist; do
                      if [ -e "$RUNNER_TEMP/kit/$path" ]; then echo "::error::$path is not export-ignored"; exit 1; fi
                  done
                  for path in composer.json packages/uxor/bin/uxor packages/uxor/src packages/uxor/INSTRUCTIONS.md; do
                      if [ ! -e "$RUNNER_TEMP/kit/$path" ]; then echo "::error::$path is export-ignored: the Composer package needs it"; exit 1; fi
                  done

            # Toolkit installs read the recipes' manifests one directory deep, so packages/ (no manifest.json) changes no
            # install, but the lint rejects every top-level directory without one: it lints a copy without packages/.
            # Only packages/ is removed, so any other unexpected directory still fails here.
            # (its output also goes to $RUNNER_TEMP/jev-lint.log, for the Jev step)
            - name: Lint
              id: lint
              run: |
                  set -o pipefail
                  cp -a "$RUNNER_TEMP/kit" "$RUNNER_TEMP/kit-lint"
                  # a manifest would make packages/ a recipe the Toolkit offers, and this lint would never see it
                  if [ -e "$RUNNER_TEMP/kit/packages/manifest.json" ]; then echo "::error::packages/ must not be a recipe"; exit 1; fi
                  rm -rf "$RUNNER_TEMP/kit-lint/packages"
                  "$RUNNER_TEMP/toolkit/vendor/bin/ux-toolkit-kit-lint" "$RUNNER_TEMP/kit-lint" 2>&1 | tee "$RUNNER_TEMP/jev-lint.log"

            - name: Debug (what the toolkit sees in the repository)
              run: |
                  "$RUNNER_TEMP/toolkit/vendor/bin/ux-toolkit-kit-debug" "$GITHUB_WORKSPACE"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Lint kit (${{ matrix.toolkit }} toolkit)
                  artifact: jev-input-ci-${{ github.job }}-${{ matrix.toolkit }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The demo's importmap packages (demo/importmap.php), downloaded once per run from the CDN (jsdelivr) and shared as
    # an artifact with every job that installs the demo: the browser shards, Kit PHP and the static site. AssetMapper
    # skips a package whose file and installed.php entry are already there, so their own install downloads nothing.
    # A CDN error is retried here, twice, before the run fails: one bad connection no longer fails a shard before any
    # test runs. The fresh-install jobs still download for themselves: that is what they check.
    importmap:
        name: Importmap packages
        needs: changes
        if: needs.changes.outputs.importmap == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 13 # 10, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer:v2
                  coverage: none

            # without the auto-scripts, whose importmap:install would download once, unretried
            # (its output, and the download's, also go to $RUNNER_TEMP/jev-<id>.log, for the Jev step)
            - name: Install the demo's dependencies
              id: deps
              working-directory: demo
              run: |
                  set -o pipefail
                  composer install --no-interaction --no-progress --no-scripts 2>&1 | tee "$RUNNER_TEMP/jev-deps.log"

            - name: Download the importmap packages (3 attempts)
              id: download
              working-directory: demo
              run: |
                  set -o pipefail
                  {
                      for attempt in 1 2 3; do
                          if bin/console importmap:install; then
                              exit 0
                          fi
                          if [ "$attempt" -lt 3 ]; then
                              echo "::warning::importmap:install failed (attempt $attempt of 3); retrying in $((attempt * 20)) s"
                              sleep $((attempt * 20))
                          fi
                      done
                      echo "::error::importmap:install failed 3 times: the CDN did not answer"
                      exit 1
                  } 2>&1 | tee "$RUNNER_TEMP/jev-download.log"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: importmap-packages
                  path: demo/assets/vendor/
                  if-no-files-found: error
                  retention-days: 1

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Importmap packages
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    php:
        name: Kit PHP
        needs: [changes, importmap]
        if: needs.changes.outputs.php == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 18 # 15, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        env:
            PHPSTAN_VERSION: '2.3.0'
            PHPSTAN_SYMFONY_VERSION: '2.1.0'
            PHPSTAN_PHPUNIT_VERSION: '2.1.1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer:v2
                  coverage: none

            # The kit lint does not look at PHP: a recipe's PHP (copied into src/ by ux:install) is checked here.
            - name: Syntax
              run: |
                  for manifest in */manifest.json; do
                      if [ -d "${manifest%/manifest.json}/src" ]; then echo "${manifest%/manifest.json}/src"; fi
                  done > "$RUNNER_TEMP/php-dirs"
                  cat "$RUNNER_TEMP/php-dirs"
                  # shellcheck disable=SC2046 # one directory per line, none with a space
                  find $(cat "$RUNNER_TEMP/php-dirs") -name '*.php' -print0 | xargs -0 -n1 php -l

            # the run's importmap packages (job importmap): the install below downloads none
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: importmap-packages
                  path: demo/assets/vendor

            # The tests render the recipes' templates as the demo has them, and its pages with their CSS
            - name: Install the demo
              run: |
                  php tools/sync-demo
                  (cd demo && composer install --no-interaction --no-progress && bin/console tailwind:build)

            # demo/tests: the data tables' limits (the deepest page, the loader calls, the selection), the Live table
            # through real Live requests, components rendered against their snapshots, the loader calls of one
            # request read from its profile, the editor's HTML policy and the Markdown renderer given hostile input, and
            # the extension contracts of the data table and the editors' form types.
            # A missing snapshot fails here instead of being written.
            - name: PHPUnit
              id: phpunit
              working-directory: demo
              env:
                  CREATE_SNAPSHOTS: 'false'
              run: bin/phpunit --log-junit "$RUNNER_TEMP/phpunit.xml"

            # Advisory diagnosis of each failed PHPUnit test by Jev (TypeSafe), as for the browser tests: the JUnit report
            # becomes the same failed-attempts.json (tools/ci/junit-attempts.mjs), with the test log as the server log. It
            # never changes the verdict (continue-on-error, and it exits 0 without the key or when the provider fails).
            - name: Jev diagnosis (advisory)
              if: ${{ failure() && steps.phpunit.outcome == 'failure' }}
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  junit: ${{ runner.temp }}/phpunit.xml
                  server-log: demo/var/log/test.log
                  job: Kit PHP
                  dir: ${{ runner.temp }}/jev-phpunit
                  artifact: jev-input-ci-phpunit-${{ github.run_id }}-${{ github.run_attempt }}

            # PHPStan reads the classes the kit's PHP uses (Symfony) from the demo's dependencies, and also checks the
            # demo's tables and tests; it is installed in a scratch directory with its Symfony and PHPUnit extensions
            # (tools/phpstan.neon), whose Symfony one reads the demo's test container.
            - name: Install PHPStan
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir phpstan && cd phpstan
                  composer require --no-interaction --no-progress "phpstan/phpstan:${PHPSTAN_VERSION}" \
                      "phpstan/phpstan-symfony:${PHPSTAN_SYMFONY_VERSION}" "phpstan/phpstan-phpunit:${PHPSTAN_PHPUNIT_VERSION}"

            # The demo's autoloader maps App\UXor\… to the recipes' own src/ (demo/composer.json).
            - name: PHPStan
              run: |
                  (cd demo && bin/console cache:warmup --env=test)
                  # shellcheck disable=SC2046 # one directory per line, none with a space
                  "$RUNNER_TEMP/phpstan/vendor/bin/phpstan" analyse --no-progress --configuration=tools/phpstan.neon \
                      --autoload-file=demo/vendor/autoload.php $(cat "$RUNNER_TEMP/php-dirs") demo/src/Demo demo/tests

    static-site:
        name: Static site
        needs: [changes, importmap]
        if: needs.changes.outputs.static-site == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 18 # 15, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        # The GitHub Pages copy (pages.yml) is built only on release: this builds it on every push, so a page that does
        # not render fails here instead of after the tag. The same build as pages.yml (tools/build-static.sh, with its
        # checks), without release metadata or the upload.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer
                  coverage: none

            # the run's importmap packages (job importmap): the build's install downloads none
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: importmap-packages
                  path: demo/assets/vendor

            # (its output also goes to $RUNNER_TEMP/jev-build.log, for the Jev step)
            - name: Build and check the static site
              id: build
              run: |
                  set -o pipefail
                  tools/build-static.sh _site --base-path="/${GITHUB_REPOSITORY#*/}" 2>&1 | tee "$RUNNER_TEMP/jev-build.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Static site
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    fresh-install:
        name: Fresh install
        needs: changes
        if: needs.changes.outputs.fresh-install == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 13 # 10, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer:v2
                  coverage: none

            # a fresh Symfony skeleton, set up as README.md says: `ux:install` of a page block and a form block works
            # (the output also goes to $RUNNER_TEMP/jev-install.log, for the Jev step)
            - name: ux:install dashboard-home on a fresh Symfony skeleton
              id: install
              env:
                  UX_TOOLKIT_VERSION: ${{ env.UX_TOOLKIT_MINIMUM_VERSION }}
              run: |
                  set -o pipefail
                  tools/tests/fresh-install.sh 2>&1 | tee "$RUNNER_TEMP/jev-install.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Fresh install
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    docker-install:
        name: Fresh install (Symfony Docker, from GitHub)
        needs: changes
        if: needs.changes.outputs.fresh-install == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 23 # 20, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # the kit as users get it: GitHub's archive of this commit, installed in a fresh Symfony Docker project on
            # the latest Symfony (the output also goes to $RUNNER_TEMP/jev-install.log, for the Jev step)
            - name: ux:install from GitHub in a fresh Symfony Docker project
              id: install
              env:
                  KIT_REPOSITORY: ${{ github.repository }}
                  KIT_REF: ${{ github.sha }}
                  UX_TOOLKIT_VERSION: ${{ env.UX_TOOLKIT_MINIMUM_VERSION }}
              run: |
                  set -o pipefail
                  tools/tests/docker-install.sh 2>&1 | tee "$RUNNER_TEMP/jev-install.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Fresh install (Symfony Docker, from GitHub)
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The demo's production image (demo/Dockerfile, target frankenphp_prod), which no other job builds: built from the
    # repository as the dev image is (the kit beside the demo, demo/Dockerfile.dockerignore naming what it holds), for
    # linux/amd64 only, then run by tools/tests/prod-image.sh: it refuses to boot without the explicit opt-in, holds no
    # baked secret, development package or Xdebug, runs as www-data, turns healthy, serves the gallery's pages (each
    # kind of file it reads from the kit) and holds nothing the allow-list leaves out. It runs when the image's build
    # inputs change (tools/ci-changes.sh); a plain build, with no cache shared with the dev image's bake.
    prod-image:
        name: Production image
        needs: changes
        if: needs.changes.outputs.prod-image == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 23 # 20, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # (the output also goes to $RUNNER_TEMP/jev-build.log, for the Jev step)
            - name: Build the production image
              id: build
              run: |
                  set -o pipefail
                  {
                      docker buildx build --platform linux/amd64 --target frankenphp_prod --load --progress plain -t uxor-demo-prod:ci -f demo/Dockerfile .
                  } 2>&1 | tee "$RUNNER_TEMP/jev-build.log"

            # (the output also goes to $RUNNER_TEMP/jev-prod-image.log, for the Jev step)
            - name: Run the production image
              id: prod-image
              run: |
                  set -o pipefail
                  tools/tests/prod-image.sh uxor-demo-prod:ci 2>&1 | tee "$RUNNER_TEMP/jev-prod-image.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Production image
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The Composer package xormania/uxor: the root composer.json and its implementation in packages/uxor/. Its metadata
    # and lock file, its install, the syntax of its PHP, its PHPUnit tests, the archive Composer and GitHub make of the
    # repository (packages/uxor/tools/check-package.py: the package's runtime is in it, its development files are not),
    # the development harness of packages/uxor/dev/, that archive installed and updated in the independent consumer
    # (check-package.py --consumer) and the package's executable. It runs on the package's minimum PHP (composer.json:
    # php >=8.4), pinned here so a later bump of the workflow's PHP_VERSION does not stop checking the minimum. Not here
    # yet (packages/uxor/dev/README.md): the consumer's browser journey with recipes installed from this commit, and
    # the Docker and Serena environment, which needs the xorder images and their support policy.
    package:
        name: Package
        needs: changes
        if: needs.changes.outputs.package == 'run'
        runs-on: ubuntu-latest
        timeout-minutes: 18 # 15 (the consumer installs a Symfony application from Packagist), plus 3 for the advisory Jev step (.github/actions/jev-diagnosis): a diagnosis must never be what times the job out
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4' # the package's minimum (composer.json: "php": ">=8.4")
                  extensions: intl, mbstring, pdo_sqlite, zip # the consumer application's (packages/uxor/dev/app)
                  tools: composer:v2
                  coverage: none

            # (each check's output also goes to $RUNNER_TEMP/jev-<id>.log, for the Jev step: tools/ci/step-attempts.mjs)
            - name: composer.json is valid and composer.lock up to date
              id: validate
              run: |
                  set -o pipefail
                  composer validate --strict 2>&1 | tee "$RUNNER_TEMP/jev-validate.log"

            - name: Install the package's dependencies
              id: install
              run: |
                  set -o pipefail
                  composer install --no-interaction --no-progress 2>&1 | tee "$RUNNER_TEMP/jev-install.log"

            # every tracked PHP file of the package, and its executable (PHP without the extension)
            - name: Syntax
              id: syntax
              run: |
                  set -o pipefail
                  { git ls-files -z -- 'packages/uxor/*.php'; printf '%s\0' packages/uxor/bin/uxor; } \
                      | xargs -0 -n1 php -l 2>&1 | tee "$RUNNER_TEMP/jev-syntax.log"

            # The bundled references (packages/uxor/resources/uxor/) are what the generator makes of this checkout's
            # docs, recipe READMEs and manifests: it regenerates them into a temporary directory and compares byte for
            # byte, and fails with the stale files' list without repairing them
            - name: The bundled references are up to date
              id: references
              run: |
                  set -o pipefail
                  php packages/uxor/tools/generate-reference.php --check 2>&1 | tee "$RUNNER_TEMP/jev-references.log"

            # (an id of its own: Kit PHP's PHPUnit step, id phpunit, is diagnosed from its JUnit report instead)
            - name: PHPUnit
              id: package-tests
              run: |
                  set -o pipefail
                  composer test 2>&1 | tee "$RUNNER_TEMP/jev-package-tests.log"

            # `git archive HEAD` of the repository, as GitHub ships it to the Toolkit and to Composer: the package's files are in it, the
            # development files are not (the runner's Python, standard library only)
            - name: The archive's payload
              id: archive
              run: |
                  set -o pipefail
                  python3 packages/uxor/tools/check-package.py 2>&1 | tee "$RUNNER_TEMP/jev-archive.log"

            # The development harness of packages/uxor/dev/ (run.py, check-serena.py, composition.py): roots, ownership and
            # provider-check ordering, without Docker or a provider (the runner's Python, standard library only)
            - name: The consumer's development harness
              id: harness
              run: |
                  set -o pipefail
                  {
                      python3 -m py_compile packages/uxor/dev/*.py packages/uxor/tools/check-package.py
                      python3 -m unittest discover -s packages/uxor/dev/tests -p 'test_*.py'
                  } 2>&1 | tee "$RUNNER_TEMP/jev-harness.log"

            # The independent consumer (packages/uxor/dev/app) installs this commit's archive as a Composer dependency:
            # Mate initialization and discovery, its tools, references and three skills, a repeated initialization, an
            # update to a newer archive that keeps consumer-written instructions and a custom component, then the
            # application without development dependencies renders in production
            - name: The archive in an independent consumer
              id: consumer
              run: |
                  set -o pipefail
                  python3 packages/uxor/tools/check-package.py --consumer 2>&1 | tee "$RUNNER_TEMP/jev-consumer.log"

            # composer.json's executable, run from the checkout: Composer links a dependency's bin into vendor/bin, not
            # the root package's own, so it finds the root vendor/autoload.php itself
            - name: The uxor command runs
              id: smoke
              run: |
                  set -o pipefail
                  {
                      php packages/uxor/bin/uxor list
                      php packages/uxor/bin/uxor catalog --query=modal --limit=1 --format=json
                  } 2>&1 | tee "$RUNNER_TEMP/jev-smoke.log"

            # Advisory diagnosis of the step that failed (.github/actions/jev-diagnosis): never the job's verdict
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  job: Package
                  artifact: jev-input-ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The demo image's build cache (ghcr.io/<owner>/<repo>-cache:dev and :main), which every run's demo build reads. It
    # is the only job that can write a package, and it runs only on dev and main, whose code changes only through
    # reviewed pull requests (the rulesets): a branch's run, and any package or test code a run executes, never holds a
    # token that can write one. It builds the image and exports its layers, nothing else (no tests, no install), and
    # never decides CI result: a cache it fails to write only makes the next builds slower.
    cache:
        name: Build cache
        needs: changes
        # a reused browser lane builds no image, so the cache is written all the same
        if: (needs.changes.outputs.demo == 'run' || needs.changes.outputs.demo == 'reuse') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # a cache that cannot be written fails no run: the run's conclusion, which release.yml waits for on main, stays
        # what CI result decides
        continue-on-error: true
        permissions:
            contents: read
            packages: write # the build cache's image, nothing else
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Name the build cache
              id: cache
              env:
                  REPO: ${{ github.repository }}
              run: |
                  image="ghcr.io/${REPO,,}-cache"
                  echo "image=$image" >> "$GITHUB_OUTPUT"

            - name: Log in to the build cache's registry
              env:
                  TOKEN: ${{ github.token }}
              run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Build the demo image into the cache
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              env:
                  DOCKER_BUILD_SUMMARY: 'false' # no build summary and no .dockerbuild record artifact per build
                  DOCKER_BUILD_RECORD_UPLOAD: 'false'
              with:
                  # bake resolves compose.override.yaml's `context: ..` against its working directory, not the file's:
                  # *.context=. below names the same repository root compose means, with no fs entitlement needed
                  source: .
                  files: |
                      demo/compose.yaml
                      demo/compose.override.yaml
                  pull: true
                  set: |
                      *.context=.
                      *.output=type=cacheonly
                      *.cache-from=type=registry,ref=${{ steps.cache.outputs.image }}:${{ github.ref_name }}
                      *.cache-to=type=registry,ref=${{ steps.cache.outputs.image }}:${{ github.ref_name }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

            - name: Log out
              if: always()
              run: docker logout ghcr.io

    demo:
        name: Demo + Playwright (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})
        needs: [changes, importmap]
        if: needs.changes.outputs.browsers == 'run'
        runs-on: ubuntu-latest
        permissions:
            contents: read # no packages: write: the build cache is written by the cache job alone, on dev and main
        # 25 for the tests, plus 3 for the advisory Jev step and its upload (.github/actions/jev-diagnosis): a diagnosis
        # must never be what times the job out
        timeout-minutes: 28
        # the browser suite is most of CI's time: one job per browser and shard, each with its own demo and browser (each
        # reads the image cache the cache job writes on dev and main). Two lanes share this one job, so its steps exist once:
        # the Chromium shards (the demo lane, CHROMIUM_SHARDS of them: every test, the screenshots included) and three
        # shards each of Firefox and WebKit (the engines lane: every behavior test, without the @screenshot ones,
        # playwright.config.ts, browserProjects()). The Changes job's plan lists the shards that run, as the matrix:
        # Chromium's when the demo lane runs, the engines' when they run (ENGINES_ON, above). docs/TESTING.md, *Browsers*
        env:
            XDEBUG_MODE: 'off' # the demo starts with it off by default (compose.override.yaml); set here so CI does not depend on that default, and the tests do not use it
        strategy:
            fail-fast: false
            # each entry: browser, shard, shards and the two projects (smoke and examples) of that browser
            matrix: ${{ fromJSON(needs.changes.outputs.browser-matrix) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              id: node # its cache-hit output, for the job's metrics
              with:
                  node-version: 22
                  cache: npm

            # The demo runs in Symfony Docker (demo/compose.yaml): FrankenPHP in worker mode, PHP 8.5
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # The demo image's build cache is an image in this repository's GitHub packages (ghcr.io/<owner>/<repo>-cache,
            # tags dev and main), not the GitHub Actions cache: a push run reads Actions caches only from its own branch
            # and main, so a new branch rebuilt from main's stale cache (~100 s instead of ~17 s); every branch reads the
            # registry's dev and main tags. The cache job below writes them, on dev and main only: no branch's run, and no
            # code a test or package runs here, holds a token that can write a package: docs/TESTING.md, *CI metrics*
            - name: Name the build cache
              id: cache
              env:
                  REPO: ${{ github.repository }}
              run: |
                  image="ghcr.io/${REPO,,}-cache"
                  echo "image=$image" >> "$GITHUB_OUTPUT"

            - name: Build the demo image
              id: image
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              env:
                  DOCKER_BUILD_SUMMARY: 'false' # no build summary and no .dockerbuild record artifact per build
                  DOCKER_BUILD_RECORD_UPLOAD: 'false'
              with:
                  # bake resolves compose.override.yaml's `context: ..` against its working directory, not the file's:
                  # *.context=. below names the same repository root compose means, with no fs entitlement needed
                  source: .
                  files: |
                      demo/compose.yaml
                      demo/compose.override.yaml
                  load: true
                  pull: true
                  set: |
                      *.context=.
                      *.cache-from=type=registry,ref=${{ steps.cache.outputs.image }}:dev
                      *.cache-from=type=registry,ref=${{ steps.cache.outputs.image }}:main
                      *.cache-from=type=gha,scope=demo-${{ github.ref }}
                      *.cache-from=type=gha,scope=demo-refs/heads/main

            # the run's importmap packages (job importmap), and what they hold, to check below that the demo's first
            # install downloaded none
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: importmap-packages
                  path: demo/assets/vendor

            - name: Record the importmap packages
              run: (cd demo/assets/vendor && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/importmap.sha256"

            - name: Start the demo (composer install on first start)
              id: start
              working-directory: demo
              run: docker compose up --wait --no-build

            # composer install's importmap:install found every package there: the files are the ones downloaded once
            # for the run, and none was added
            - name: The demo's install downloaded no importmap package
              run: |
                  diff "$RUNNER_TEMP/importmap.sha256" <(cd demo/assets/vendor && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
                      || { echo "::error::the demo's install changed demo/assets/vendor: it did not use the run's importmap packages"; exit 1; }

            - name: Sync recipes into the demo
              id: sync
              working-directory: demo
              run: docker compose exec -T php php ../tools/sync-demo

            # The copies sync-demo writes are gitignored (demo/.gitignore), so this cannot compare them with anything: it
            # checks that the sync and the demo's start left every tracked file alone. tools/tests/sync-demo.sh below
            # checks that the copies are what ux:install writes. Deterministic checks run on one shard only (Chromium's 1).
            - name: The sync leaves tracked files unchanged
              id: tracked
              if: matrix.browser == 'chromium' && matrix.shard == 1
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      git status --porcelain
                      echo "::error::tools/sync-demo or the demo's start changed tracked files: it must only write gitignored copies"
                      exit 1
                  fi

            - name: The demo's composer.json and composer.lock are valid
              id: composer
              if: matrix.browser == 'chromium' && matrix.shard == 1
              working-directory: demo
              run: docker compose exec -T php composer validate --no-check-publish --strict   # also fails on a stale composer.lock

            - name: sync-demo copies what ux:install copies
              id: sync-parity
              if: matrix.browser == 'chromium' && matrix.shard == 1
              working-directory: demo
              run: docker compose exec -T php bash ../tools/tests/sync-demo.sh

            # The browser runs in the Playwright image pinned by UXor (see playwright.config.ts), so
            # screenshot comparisons use a reproducible browser environment and UXor's committed baselines. The image
            # holds the three browsers; the tests launch only the job's own. Each part's seconds go to the job's metrics.
            - name: Install Playwright
              id: install
              run: |
                  start=$SECONDS
                  npm ci
                  echo "npm-ci-seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
                  start=$SECONDS
                  # the image pinned by digest; fails when its tag is not the locked @playwright/test (tools/playwright-image.mjs)
                  image=$(node tools/playwright-image.mjs)
                  docker pull "$image"
                  echo "image-pull-seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"

            # The recipe specs' runnable copies and the demo's CSS, recorded with what it was built from
            # (tools/prepare-tests.mjs): Playwright finds both up to date, and a failed build reads as a setup failure
            - name: Prepare the tests
              id: prepare
              env:
                  DEMO_URL: https://localhost
              run: node tools/prepare-tests.mjs

            # the run's shard timings, the same file in every shard (the Changes job)
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.changes.outputs.timings }}
                  path: ${{ runner.temp }}/shard-timings

            # The shard's tests, split by recorded test time instead of Playwright's count split (tools/ci/shard-plan.mjs,
            # tests/shard-timings.json): every shard lists the job's tests with the same projects and filters as the run
            # below, computes the same plan (longest first to the least loaded shard), and runs its own list
            # (--test-list), after checking that Playwright selects exactly its planned tests. Missing or stale timings
            # (under half the listed tests timed) fall back to --shard=N/M in every shard alike. A list that cannot be
            # read, or a plan that would drop or repeat a test, fails here: a shard never runs a guess.
            # docs/TESTING.md, *Shard balance*
            - name: Plan the shard's tests
              id: plan
              env:
                  DEMO_URL: https://localhost
                  PLAN_DIR: ${{ runner.temp }}/shard-plan
              # --list also prints every test: kept in a file, shown when the listing fails
              run: |
                  mkdir -p "$PLAN_DIR"
                  PLAYWRIGHT_JSON_OUTPUT_FILE="$PLAN_DIR/all.json" npx playwright test --list --reporter=json ${{ matrix.projects }} \
                      > "$PLAN_DIR/all.log" 2>&1 || { cat "$PLAN_DIR/all.log"; exit 1; }
                  node tools/ci/shard-plan.mjs plan --list "$PLAN_DIR/all.json" --timings "$RUNNER_TEMP/shard-timings/shard-timings.json" \
                      --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --out "$PLAN_DIR"
                  mkdir -p playwright-results
                  cp "$PLAN_DIR/plan.json" playwright-results/shard-plan.json
                  if [ -f "$PLAN_DIR/shard-${{ matrix.shard }}.txt" ]; then
                      PLAYWRIGHT_JSON_OUTPUT_FILE="$PLAN_DIR/mine.json" npx playwright test --list --reporter=json ${{ matrix.projects }} \
                          --test-list "$PLAN_DIR/shard-${{ matrix.shard }}.txt" > "$PLAN_DIR/mine.log" 2>&1 || { cat "$PLAN_DIR/mine.log"; exit 1; }
                      node tools/ci/shard-plan.mjs verify --plan "$PLAN_DIR/plan.json" --shard ${{ matrix.shard }} --list "$PLAN_DIR/mine.json"
                  fi

            # The browser server on the runner's own network (the pinned image the Install step pulled), so the browser
            # reaches https://localhost itself instead of through the test process (playwright.config.ts,
            # PW_DIRECT_NETWORK); Playwright then reuses it. Fails here, with the server's log, when port 3000 is already
            # taken or the server does not answer within two minutes
            - name: Start the browser server
              id: browser-server
              run: |
                  if ss -Hltn 'sport = :3000' | grep -q .; then
                      echo "::error::port 3000 is already in use: the browser server cannot start"; ss -ltnp 'sport = :3000'; exit 1
                  fi
                  image=$(node tools/playwright-image.mjs)
                  version=$(node -p "require('@playwright/test/package.json').version")
                  docker run -d --rm --init --name playwright-browser --network host "$image" \
                      npx -y "playwright@$version" run-server --port 3000 --host 127.0.0.1 > /dev/null
                  for _ in $(seq 1 120); do
                      if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" != 000 ]; then
                          echo "browser server up: $image"; exit 0
                      fi
                      docker inspect playwright-browser > /dev/null 2>&1 || break
                      sleep 1
                  done
                  echo "::error::the browser server did not answer on port 3000"; docker logs playwright-browser 2>&1 | tail -50 || true; exit 1

            # Two workers per shard, stated rather than left to Playwright's default (half the runner's 4 vCPUs, also
            # 2): the measured choice in docs/TESTING.md (*Worker budget*). The release checks run in
            # release-checks.yml, not here (their projects exist only with RELEASE_CHECKS set)
            - name: Playwright (smoke + every README example + UXor recipe specs)
              id: tests
              env:
                  DEMO_URL: https://localhost
                  PW_DIRECT_NETWORK: '1'
              run: npx playwright test ${{ matrix.projects }} ${{ steps.plan.outputs.args }} --workers=2

            # What the shard's tests did, read from playwright-results/results.json (tools/ci/playwright-summary.mjs): the
            # counts, each failed and flaky (passed on retry) test with its error, the tested commit and versions, and
            # the durations (report-only, no threshold), on the job's summary page and as annotations at the failing
            # lines. It never turns a red run green: Playwright's exit status is the verdict. It fails when there is no
            # evidence to read: a step before the tests failed ("tests not reached: setup failed at <step>"), or the
            # report is missing or invalid (never a pass with zero tests).
            - name: Read the results
              id: results
              if: ${{ !cancelled() }}
              env:
                  SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
                  BROWSER: ${{ matrix.browser }}
                  RESULTS_ARTIFACT: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
                  REPORT_ARTIFACT: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
                  DEMO_STARTED: ${{ steps.start.outcome }}
                  TESTS_OUTCOME: ${{ steps.tests.outcome }}
                  SETUP_STEPS: |
                      Build the demo image=${{ steps.image.outcome }}
                      Start the demo=${{ steps.start.outcome }}
                      Sync recipes into the demo=${{ steps.sync.outcome }}
                      The sync leaves tracked files unchanged=${{ steps.tracked.outcome }}
                      The demo's composer.json and composer.lock are valid=${{ steps.composer.outcome }}
                      sync-demo copies what ux:install copies=${{ steps.sync-parity.outcome }}
                      Install Playwright=${{ steps.install.outcome }}
                      Prepare the tests=${{ steps.prepare.outcome }}
                      Plan the shard's tests=${{ steps.plan.outcome }}
                      Start the browser server=${{ steps.browser-server.outcome }}
              run: |
                  if [ "$DEMO_STARTED" = success ]; then
                      # the PHP snippet is single-quoted on purpose: its $m is PHP's, not the shell's
                      # shellcheck disable=SC2016
                      RUNTIME=$(cd demo && timeout 60 docker compose exec -T php php -r 'require "vendor/autoload.php"; $m = require "importmap.php";
                          echo "PHP=", PHP_VERSION, "\nSymfony=", Symfony\Component\HttpKernel\Kernel::VERSION, "\nTurbo=", $m["@hotwired/turbo"]["version"] ?? "", "\n";') || true
                      export RUNTIME
                  fi
                  node tools/ci/playwright-summary.mjs playwright-results/results.json

            # CI's own numbers, for later optimizations (tools/ci/ci-metrics.mjs job), report only: the demo image's
            # build records (cached of total steps: did the GitHub Actions cache serve the build), the npm cache hit and
            # the seconds of npm ci and of the Playwright image's pull, in job-metrics.json next to the results. CI
            # result gathers every shard's with their durations.json. It never fails the job.
            - name: Record the job's metrics (advisory)
              if: ${{ !cancelled() }}
              continue-on-error: true
              timeout-minutes: 1
              env:
                  BROWSER: ${{ matrix.browser }}
                  SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
                  NPM_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
                  NPM_CI_SECONDS: ${{ steps.install.outputs.npm-ci-seconds }}
                  IMAGE_PULL_SECONDS: ${{ steps.install.outputs.image-pull-seconds }}
              run: |
                  timeout 30 docker buildx history ls --format json > "$RUNNER_TEMP/buildx-history.jsonl" || true
                  node tools/ci/ci-metrics.mjs job --buildx "$RUNNER_TEMP/buildx-history.jsonl" --out playwright-results/job-metrics.json

            # Every shard keeps its results, green or red: results.json (each test's attempts, durations and outcome:
            # passed, failed, flaky), failed-attempts.json (every failed attempt, retry-recovered ones included),
            # durations.json (wall time, summed test time, slowest tests, per-file totals: report-only, to compare runs),
            # job-metrics.json (the build cache and setup times above), shard-plan.json (how the shard's tests were
            # chosen, and every shard's planned tests and time) and summary.md, so a test that failed once and passed on its retry leaves a record
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
                  path: playwright-results/
                  retention-days: 30

            # the end of the server log here, after the test results; the whole log in test-results/ (uploaded below)
            - name: Demo logs
              if: failure()
              working-directory: demo
              run: |
                  mkdir -p ../test-results
                  docker compose logs php > ../test-results/demo-php.log
                  tail -n 300 ../test-results/demo-php.log

            # the full report and the traces of failed attempts: on a failure, or a test that passed only on its retry
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ failure() || steps.results.outputs.flaky > 0 }}
              with:
                  name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            # Advisory diagnosis of each failed attempt, retry-recovered ones included, by Jev (TypeSafe):
            # tools/ci/jev-diagnosis.mjs sends each attempt's sanitized error and the server log lines of its time span,
            # and shows the likely cause and the excerpt it selects as a warning; one assessment.json per failed attempt
            # and the summary are kept like the results, 30 days (.github/actions/jev-diagnosis). It never changes the
            # verdict: it may fail or time out (continue-on-error), it exits 0 when the key is missing or the provider
            # fails, and it runs after the tests. The key is given to this step only.
            - name: Jev diagnosis (advisory)
              if: ${{ always() && (steps.results.outputs.failed > 0 || steps.results.outputs.flaky > 0) }}
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  attempts: playwright-results/failed-attempts.json
                  compose-logs: demo
                  shard: ${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }}
                  dir: ${{ runner.temp }}/jev-${{ matrix.browser }}-${{ matrix.shard }}
                  artifact: jev-input-ci-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

            # Last, so the end of the job log names what failed (after the demo's logs): the summary written above
            - name: Playwright summary
              if: ${{ !cancelled() }}
              run: |
                  cat playwright-results/summary.md 2>/dev/null || echo "No summary, the Read the results step did not run to the end"

    # One check for the branch rulesets to require. A skipped matrix job reports one check named after its unexpanded
    # matrix ("Demo + Playwright (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})"), never the per-shard names, so requiring those would leave a
    # pull request pending forever. It passes when each lane ran fresh and passed, reused an earlier pass whose evidence
    # still holds (requalified here), or was skipped as unaffected; and records the lanes that ran fresh, for later runs
    # (tools/ci/lane-evidence.mjs, docs/TESTING.md, *Reused lanes*).
    result:
        # The required check is the push's (and a full manual run's): the daily run and an engines-only run test part of a
        # head and publish under names of their own, so a later green one can never stand in for a red CI result
        name: ${{ github.event_name == 'workflow_dispatch' && inputs.daily && github.ref == 'refs/heads/dev' && 'CI result (daily)' || github.event_name == 'workflow_dispatch' && inputs.engines_only && 'CI result (engines only)' || 'CI result' }}
        if: ${{ always() && github.event_name != 'schedule' }}
        needs: [changes, quick, importmap, lint-kit, php, static-site, fresh-install, docker-install, package, demo, prod-image]
        runs-on: ubuntu-latest
        # the daily run's engines, for the Engines issue job: passed or failed, and what changed since their last pass
        outputs:
            engines-status: ${{ steps.finish.outputs.engines-status }}
            engines-report: ${{ steps.finish.outputs.engines-report }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read # the run's jobs, the lanes' markers
        # No setup-node: the tool (Node's own modules only) runs on the runner image's Node, which it checks is 20 or later.
        # It is the tool of the run's own commit, from a sparse checkout: only plan.json comes from the Changes job's
        # artifact. The advisory CI metrics are the CI metrics job, after this one.
        steps:
            # The finish below runs the tool of the run's own commit, checked out here, never anything from
            # an artifact: only plan.json comes from the Changes job's artifact, by its id, and its SHA-256 (a Changes job
            # output) is checked before anything reads it
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: ${{ always() }}
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      tools/ci

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: ${{ always() && needs.changes.result == 'success' }}
              continue-on-error: true
              with:
                  artifact-ids: ${{ needs.changes.outputs.lane-plan-id }}
                  merge-multiple: true
                  path: ${{ runner.temp }}/lane-plan

            # The Changes job must have succeeded, and plan.json must be the one it wrote: else no record and no verdict,
            # and this step fails the job
            - name: The lane plan is the one the Changes job wrote
              id: lane-plan
              if: ${{ always() }}
              env:
                  CHANGES: ${{ needs.changes.result }}
                  PLAN_SHA256: ${{ needs.changes.outputs.lane-plan-sha256 }}
              run: |
                  if [ "$CHANGES" != success ]; then
                      echo "::error::the Changes job ended with $CHANGES: no plan, no verdict"
                      exit 1
                  fi
                  plan="$RUNNER_TEMP/lane-plan/plan.json"
                  if [ ! -f "$plan" ] || [ -z "$PLAN_SHA256" ] || ! printf '%s  %s\n' "$PLAN_SHA256" "$plan" | sha256sum --check --status; then
                      echo "::error::plan.json is not the one the Changes job wrote (missing, or another SHA-256 than its output): no verdict"
                      exit 1
                  fi

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: ${{ always() && needs.demo.result != 'skipped' }}
              continue-on-error: true
              with:
                  pattern: playwright-results-*
                  path: ${{ runner.temp }}/shards

            # One step, the tool's finish: the markers of the lanes that ran (reuse on or off: a pass when every job of the
            # lane passed in its latest attempt, a failure when one failed, nothing when one was cancelled), then the
            # verdict, per lane: fresh, reused (its evidence checked again), not applicable, NOT RUN AT THIS STAGE (the
            # engines, deferred) or incomplete. Changes, Tool tests and Importmap packages must pass or be skipped. A
            # failure marker is never best effort: one that cannot be recorded (the job
            # list unreadable) fails this step, and its upload below is never continue-on-error; a lost pass marker warns.
            - name: Every lane passed, was reused or was skipped
              id: finish
              if: ${{ always() && steps.lane-plan.outcome == 'success' }}
              timeout-minutes: 3
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  set -o pipefail
                  echo "Node $(node --version)"
                  printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
                  # a listing that fails leaves no file: the tool then fails if a failure marker was due, and the verdict
                  # looks the jobs up itself when the browser job ran
                  if ! gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[]' | jq -s . > "$RUNNER_TEMP/run-jobs.json"; then
                      echo "::warning::the run's jobs could not be listed"
                      rm -f "$RUNNER_TEMP/run-jobs.json"
                  fi
                  node tools/ci/lane-evidence.mjs finish --plan "$RUNNER_TEMP/lane-plan/plan.json" --needs "$RUNNER_TEMP/needs.json" \
                      --jobs "$RUNNER_TEMP/run-jobs.json" --shards "$RUNNER_TEMP/shards" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
                      --out "$RUNNER_TEMP/lane-markers" --repo "$REPO" \
                      --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

            # One artifact per lane and kind: its name is the marker a later run looks up (kept a day past the 14 days the
            # longest-lived counts). Names are unique within a run, so a later attempt's marker replaces the earlier one
            # (overwrite): the newest attempt's result is the one that stands. A failure's upload may not fail quietly.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.php-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.php-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.php-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.php-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.php-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.php-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.demo-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.demo-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.demo-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.demo-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.demo-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.demo-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.engines-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.engines-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.engines-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.engines-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.engines-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.engines-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.prod-image-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.prod-image-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.prod-image-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.prod-image-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.prod-image-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.prod-image-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.fresh-install-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.fresh-install-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.fresh-install-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.fresh-install-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.fresh-install-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.fresh-install-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.lint-kit-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.lint-kit-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.lint-kit-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.lint-kit-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.lint-kit-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.lint-kit-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.package-kind == 'pass' }}
              continue-on-error: true
              with:
                  name: ${{ steps.finish.outputs.package-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.package-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.finish.outputs.package-kind == 'fail' }}
              with:
                  name: ${{ steps.finish.outputs.package-marker }}
                  path: ${{ runner.temp }}/lane-markers/${{ steps.finish.outputs.package-marker }}/evidence.json
                  overwrite: true
                  retention-days: 15

    # CI's own numbers, for later optimizations (tools/ci/ci-metrics.mjs run), report only, after CI result so the
    # required check never waits for them, and allowed to fail without failing the run (release.yml and the lookups of
    # dev's last green run read the run's conclusion). No ruleset names this job. Every shard's durations.json and
    # job-metrics.json, and every job's queue and step times from GitHub's API but this job's own, in one summary (the
    # shard balance per browser, each shard's setup, tests and worker use, the run's slowest tests and files, the retried
    # tests, the browser jobs' time per step) and ci-metrics.json, kept 90 days to compare runs: docs/TESTING.md, *CI
    # metrics*. With them, shard-timings.json: tests/shard-timings.json refreshed from this run's durations
    # (tools/ci/shard-plan.mjs timings), to copy over the committed one when the shards drift: docs/TESTING.md, *Shard
    # balance*; the next run's Changes job plans its shards from it (the ci-metrics artifact)
    metrics:
        name: CI metrics
        needs: [changes, demo, result]
        if: ${{ always() && github.event_name != 'schedule' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        continue-on-error: true
        permissions:
            contents: read
            actions: read # the run's jobs and their step times
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      tools/ci
                      tests

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: ${{ needs.demo.result != 'skipped' }}
              continue-on-error: true
              with:
                  pattern: playwright-results-*
                  path: ${{ runner.temp }}/shards

            # The timings this run planned from, preserved even when its browser jobs were skipped.
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              continue-on-error: true
              with:
                  name: ${{ needs.changes.outputs.timings }}
                  path: ${{ runner.temp }}/shard-timings

            - name: CI metrics (advisory)
              continue-on-error: true
              timeout-minutes: 2
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name != "CI metrics")' \
                      > "$RUNNER_TEMP/jobs.jsonl" || echo "::warning::CI metrics: the run's jobs could not be listed"
                  node tools/ci/ci-metrics.mjs run --shards "$RUNNER_TEMP/shards" --jobs "$RUNNER_TEMP/jobs.jsonl" --out "$RUNNER_TEMP/ci-metrics"

            - name: Shard timings (advisory)
              continue-on-error: true
              timeout-minutes: 1
              run: |
                  previous="$RUNNER_TEMP/shard-timings/shard-timings.json"
                  [ -f "$previous" ] || previous=tests/shard-timings.json
                  node tools/ci/shard-plan.mjs timings --shards "$RUNNER_TEMP/shards" --previous "$previous" \
                      --out "$RUNNER_TEMP/ci-metrics/shard-timings.json"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              continue-on-error: true
              with:
                  name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/ci-metrics/
                  if-no-files-found: warn
                  retention-days: 90

    # The daily run's Firefox and WebKit verdict on one issue labeled engines, after the release checks' issue: a failure
    # opens it, or comments on the open one, naming the commits since their last all-browser pass; a pass closes it. Only
    # the daily run on dev reports here: a push that defers them, or a manual run, shows its result where it ran.
    engines-issue:
        name: Engines issue
        needs: result
        if: ${{ always() && inputs.daily && github.ref == 'refs/heads/dev' && needs.result.outputs.engines-status != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            # failed (a shard failed) and incomplete (cancelled, short, unreadable) both comment, each in its own words
            - id: issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  STATUS: ${{ needs.result.outputs.engines-status }}
                  REPORT: ${{ needs.result.outputs.engines-report }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  open=$(gh issue list --repo "$REPO" --label engines --state open --limit 1 --json number --jq '.[0].number // empty')
                  if [ "$STATUS" = passed ]; then
                      if [ -n "$open" ]; then
                          gh issue close "$open" --repo "$REPO" --comment "$REPORT: $RUN_URL"
                      fi
                      exit 0
                  fi
                  body="$REPORT. Run: $RUN_URL"
                  if [ -n "$open" ]; then
                      gh issue comment "$open" --repo "$REPO" --body "$body"
                  else
                      gh label create engines --repo "$REPO" --color B60205 \
                          --description 'The daily Firefox and WebKit run failed on dev (ci.yml)' 2>/dev/null || true
                      gh issue create --repo "$REPO" --label engines --title 'Firefox or WebKit fails on dev' --body "$body"
                  fi
