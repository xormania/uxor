name: Mago providers

on:
    # Compare pull requests with their base so merging dev into a feature branch
    # does not rerun the provider checks for changes that already landed there.
    pull_request:
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - packages/uxor/dev/environment_acceptance.py
            - packages/uxor/dev/tests/test_mago.py
            - packages/uxor/dev/tests/test_serena_provider.py
            - packages/uxor/src/**
            - packages/uxor/tools/check-package.py
            - packages/uxor/dev/app/**
            - composer.json
            - composer.lock
            - .github/workflows/mago-providers.yml
    push:
        branches: [dev, main]
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - packages/uxor/dev/environment_acceptance.py
            - packages/uxor/dev/tests/test_mago.py
            - packages/uxor/dev/tests/test_serena_provider.py
            - packages/uxor/src/**
            - packages/uxor/tools/check-package.py
            - packages/uxor/dev/app/**
            - composer.json
            - composer.lock
            - .github/workflows/mago-providers.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    providers:
        name: CLI and language server
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  version: '0.13.9'
                  enable-cache: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Run both providers on first use
              run: |
                  for provider in cli serena; do
                      tag=$(packages/uxor/bin/uxor-mago image "$provider")
                      if docker image inspect "$tag" >/dev/null 2>&1; then
                          echo "::error::The first-use check needs an uncached provider tag: $tag"
                          exit 1
                      fi
                      packages/uxor/bin/uxor-mago version "$provider"
                  done

            - name: Check the installed archive through setup, Symfony semantics and source repair
              run: python3 packages/uxor/tools/check-package.py --consumer --providers
