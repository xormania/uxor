name: Mago providers

on:
    # Compare pull requests with their base so merging dev into a feature branch
    # does not rerun the provider checks for changes that already landed there.
    pull_request:
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - .github/workflows/mago-providers.yml
    push:
        branches: [dev, main]
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - .github/workflows/mago-providers.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    providers:
        name: CLI and language server
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: '0.13.9'
                  enable-cache: false

            - name: Build the CLI provider from the package
              run: packages/uxor/bin/uxor-mago pull cli

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Name the build cache
              id: cache
              env:
                  REPO: ${{ github.repository }}
              run: |
                  image="ghcr.io/${REPO,,}-cache"
                  echo "image=$image" >> "$GITHUB_OUTPUT"

            # CI's Build cache job exports these layers on dev and main. BuildKit uses them when they match the
            # package recipe and inputs, and builds from source when they do not.
            - name: Build the Serena provider from the package
              run: |
                  tag=$(packages/uxor/bin/uxor-mago image serena)
                  docker buildx build --load --tag "$tag" \
                      "--cache-from=type=registry,ref=${{ steps.cache.outputs.image }}:mago-serena-dev" \
                      "--cache-from=type=registry,ref=${{ steps.cache.outputs.image }}:mago-serena-main" \
                      packages/uxor/resources/mago/serena

            - name: Check Mago diagnostics and navigation over MCP
              run: uv run --script packages/uxor/dev/check-mago.py
