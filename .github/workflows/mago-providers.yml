name: Mago providers

on:
    # Compare pull requests with their base so merging dev into a feature branch
    # does not rerun the provider checks for changes that already landed there.
    pull_request:
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - .github/workflows/mago-providers.yml
    push:
        branches: [dev, main]
        paths:
            - packages/uxor/resources/mago/**
            - packages/uxor/bin/uxor-mago
            - packages/uxor/dev/check-mago.py
            - .github/workflows/mago-providers.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    providers:
        name: CLI and language server
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: '0.13.9'
                  enable-cache: false

            - name: Build both providers from the package
              run: packages/uxor/bin/uxor-mago pull

            - name: Check Mago diagnostics and navigation over MCP
              run: uv run --script packages/uxor/dev/check-mago.py
