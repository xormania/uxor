name: Metadata

# Compatibility while the main and dev rulesets still require Mentions. Relevant account/team mentions and
# package syntax are permitted. This job processes no contributor text and may be removed once that required
# status is removed from the rulesets. The optional strict checker remains available for callers that choose it.
on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read

jobs:
    mentions:
        name: Mentions
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Retired notification restriction
              id: retired
              run: echo 'The mandatory mention restriction is retired. This compatibility check preserves existing required-status settings.'
