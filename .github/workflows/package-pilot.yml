name: Package pilot

# Feature pushes check real archive installs, Symfony builds, upgrades and rollback. Browser contracts are available
# by hand while the PHP integration is under development; a manual run includes them unless explicitly disabled.
on:
    push:
        branches: ['feat/upgradeable-components', 'feat/upgradeable-components--*']
    workflow_dispatch:
        inputs:
            browsers:
                description: 'Include the packaged consumer browser contracts'
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: package-pilot-${{ github.ref }}
    cancel-in-progress: true

jobs:
    upgrade:
        name: Packaged consumer upgrade
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            PILOT_IMAGE: ghcr.io/xormania/uxor-dev@sha256:c271b1f78c7bccaf5a0c3e962c2ac09707d3088705fc8ff8f1bae83c70c0cdfd
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0 # The immutable baseline release comes from an earlier commit.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: Select browser checks
              env:
                  EVENT: ${{ github.event_name }}
                  BROWSERS: ${{ inputs.browsers }}
              run: |
                  if [ "$EVENT" = workflow_dispatch ] && [ "$BROWSERS" = true ]; then
                      echo 'PILOT_BROWSER_CONTAINER=package-pilot-browser' >> "$GITHUB_ENV"
                      echo 'Archive upgrade and rollback: PHP/Symfony and browser contracts.' >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo 'Archive upgrade and rollback: PHP/Symfony checks. Browser contracts are unrun; start a manual run with browsers enabled to include them.' >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Pull the project-pinned PHP image
              run: docker pull "$PILOT_IMAGE"
            - name: Start the project-pinned browser server
              if: env.PILOT_BROWSER_CONTAINER != ''
              run: |
                  image=$(node -p "require('./tools/playwright-image.json').image")
                  version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
                  docker pull "$image"
                  docker run -d --init --name "$PILOT_BROWSER_CONTAINER" --memory=4g --cpus=2 --shm-size=1g \
                      "$image" npx -y "playwright@$version" run-server --port 3000 --host 0.0.0.0
                  ready=0
                  for _ in $(seq 1 60); do
                      if docker exec "$PILOT_BROWSER_CONTAINER" node -e \
                          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
                          ready=1; break
                      fi
                      sleep 1
                  done
                  [ "$ready" = 1 ] || { docker logs "$PILOT_BROWSER_CONTAINER"; exit 1; }
            - name: Upgrade, rollback and source fingerprints
              run: bash tools/tests/package-pilot.sh
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: package-pilot-evidence
                  path: test-results/package-pilot.*/
                  if-no-files-found: warn
                  retention-days: 7
            - name: Stop the browser started by this job
              if: always() && env.PILOT_BROWSER_CONTAINER != ''
              run: docker rm -f "$PILOT_BROWSER_CONTAINER" || true
