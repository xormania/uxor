name: Pages

# The demo's showcase as a static site on GitHub Pages: the index, every recipe page and every README example in both
# themes, rendered by `bin/console app:export-static`, with the /demo application's pages. The site always shows the
# latest published release (docs/PLAN-docs-automation.md): release.yml calls it once it has published a version, and a
# manual run on main rebuilds the latest release (a repair after a failed build or deployment), never a branch. Work on
# dev is built and checked by CI's *Static site* job and never replaces the site.
#
# One release identity throughout: *Which release* reads GitHub's latest Release (never a draft or a prerelease) and the
# commit its tag points at, from the API alone: no input chooses what is checked out (CodeQL: cache poisoning, the
# build runs in the default branch's context). release.yml's version is only compared with it. The build checks out
# that commit, builds it with its own tools/build-static.sh, checks the pages name that version, and writes
# release.json beside them; the deploy checks again that the version is still the latest, at that commit, so an older
# run never replaces a newer release's site.
on:
    workflow_call:
        inputs:
            release:
                description: The version release.yml published (X.Y.Z), which must be the latest Release
                type: string
                required: true
    # by hand on main: rebuilds the latest release
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # The release to publish: no branch fallback, a version that is not the latest published Release stops here
    resolve:
        name: Which release
        # a manual run only from main (from release.yml, the event is release.yml's own)
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.release.outputs.version }}
            commit: ${{ steps.release.outputs.commit }}
        steps:
            # what to publish, from GitHub's Releases alone
            - id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  # GitHub's latest Release: never a draft or a prerelease
                  version=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
                  if [ -z "$version" ]; then
                      echo "::error::No published release: nothing to publish"
                      exit 1
                  fi
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::The latest release '$version' is not a version (X.Y.Z)"
                      exit 1
                  fi
                  if [ -z "$(gh api "repos/$REPO/releases/tags/$version" --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)" ]; then
                      echo "::error::$version is not a published release (missing, a draft or a prerelease)"
                      exit 1
                  fi
                  # the commit the tag points at, an annotated tag peeled
                  commit=$(gh api "repos/$REPO/commits/$version" --jq .sha)
                  if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::$version: no commit for its tag"
                      exit 1
                  fi
                  echo "Publishing release $version, commit $commit"
                  printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
            # release.yml's version is the latest release, or nothing is published (a newer one came out meanwhile)
            - id: expected
              if: inputs.release != ''
              env:
                  EXPECTED: ${{ inputs.release }}
                  VERSION: ${{ steps.release.outputs.version }}
              run: |
                  if [ "$EXPECTED" != "$VERSION" ]; then
                      echo "::error::$EXPECTED is not the latest release ($VERSION): the site shows the latest one"
                      exit 1
                  fi

    build:
        name: Build the site
        needs: resolve
        runs-on: ubuntu-latest
        timeout-minutes: 18 # 15, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.resolve.outputs.commit }}
                  fetch-depth: 0 # the tags: the release's own tag names it in the install commands
            - name: Check the release's tag
              id: tag
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
                  COMMIT: ${{ needs.resolve.outputs.commit }}
              run: |
                  tagged=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}" || true)
                  if [ "$(git rev-parse HEAD)" != "$COMMIT" ] || [ "$tagged" != "$COMMIT" ]; then
                      echo "::error::The checkout ($(git rev-parse HEAD)) and the tag $VERSION (${tagged:-none}) are not the resolved commit $COMMIT"
                      exit 1
                  fi
            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer
                  coverage: none
            # the same build and checks as CI's Static site job, with the release's own script: the checkout is the
            # tag's commit, so --release-from-tags names exactly that version (the output also goes to
            # $RUNNER_TEMP/jev-build.log, for the Jev step)
            - name: Build and check the site
              id: build
              run: |
                  set -o pipefail
                  tools/build-static.sh _site --base-path="/${GITHUB_REPOSITORY#*/}" --release-from-tags --branch=main 2>&1 | tee "$RUNNER_TEMP/jev-build.log"
            # The site the deploy uploads names this release: its install command installs it, and release.json
            # records the version and the commit for the deploy's own check and for anyone reading the site
            - name: Check the release identity
              id: identity
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
                  COMMIT: ${{ needs.resolve.outputs.commit }}
              run: |
                  kit="$(jq -r .homepage manifest.json):$VERSION"
                  if ! grep -qF -- "$kit" _site/index.html; then
                      echo "::error::The site's install command does not install $kit"
                      exit 1
                  fi
                  jq -n --arg version "$VERSION" --arg commit "$COMMIT" --arg repository "$(jq -r .homepage manifest.json)" \
                      '{version: $version, commit: $commit, repository: $repository}' > _site/release.json
                  cat _site/release.json
            # The failed build's log, for the *Jev diagnosis* job below: no local action runs in this job, which checks
            # out a commit chosen at run time in the default branch's context (CodeQL: cache poisoning)
            - if: failure() && steps.build.outcome == 'failure'
              continue-on-error: true # a report, never the verdict
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pages-build-log-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/jev-build.log
                  retention-days: 1
                  if-no-files-found: ignore
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site

    # Advisory diagnosis of a failed build (.github/actions/jev-diagnosis): never the verdict. On its own runner, with
    # this workflow's own tools and no checkout of the release: it reads the build's log from the artifact above and
    # collects it as the build job's step `build`. Called from release.yml, the run's workflow is release.yml's, so it
    # names this file; the key comes from the caller (jev.yml).
    diagnose:
        name: Jev diagnosis (advisory)
        needs: build
        if: failure() && needs.build.result == 'failure'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}
                  sparse-checkout: |
                      tools/ci
                      .github/actions/jev-diagnosis
                      .github/workflows/pages.yml
                  sparse-checkout-cone-mode: false
            - id: log
              continue-on-error: true
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: pages-build-log-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}
            - if: steps.log.outcome == 'success'
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: '{"build":{"outcome":"failure","conclusion":"failure","outputs":{}}}'
                  job-id: build
                  workflow: .github/workflows/pages.yml
                  job: Build the site
                  artifact: jev-input-pages-build-${{ github.run_id }}-${{ github.run_attempt }}

    deploy:
        name: Deploy
        needs: [resolve, build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # the Releases, for the freshness check
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # Still the latest release, at the same commit: a run that waited behind a newer release's run (the pages
            # concurrency group serializes them, it does not order them) or was re-run later deploys nothing
            - name: Check the release is still the latest
              id: fresh
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  COMMIT: ${{ needs.resolve.outputs.commit }}
              run: |
                  latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
                  commit=$(gh api "repos/$REPO/commits/$VERSION" --jq .sha 2>/dev/null || true)
                  if [ "$latest" != "$VERSION" ] || [ "$commit" != "$COMMIT" ]; then
                      echo "::error::This site is release $VERSION at $COMMIT; the latest release is now ${latest:-unknown}${commit:+, its tag at $commit}. Not deploying: run Pages again for the latest"
                      exit 1
                  fi
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
            # The site as deployed, at the URL GitHub Pages gives it: the release it shows (release.json), the index, a
            # recipe page and the guides, each naming its canonical URL at that address, and the sitemap, llms.txt and a
            # recipe's Markdown. What the build checked in its files, checked where readers get it: a base path or a
            # host that differs shows only here. Pages may take a moment to serve a new deployment: asked again for
            # about two minutes before failing.
            - name: Check the deployed site
              id: live
              env:
                  PAGE_URL: ${{ steps.deployment.outputs.page_url }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  COMMIT: ${{ needs.resolve.outputs.commit }}
                  ATTEMPTS: '8'
                  WAIT: '15'
              run: |
                  site=${PAGE_URL%/}
                  get() { curl -fsSL --max-time 20 "$site/$1"; }
                  live() {
                      problem=''
                      release=$(get release.json) || { problem='release.json does not answer'; return 1; }
                      [ "$(jq -r .version <<<"$release")" = "$VERSION" ] && [ "$(jq -r .commit <<<"$release")" = "$COMMIT" ] \
                          || { problem="release.json is $(jq -c '{version, commit}' <<<"$release"), not $VERSION at $COMMIT"; return 1; }
                      for page in '' r/button/ install/ guide/; do
                          html=$(get "$page") || { problem="/$page does not answer"; return 1; }
                          grep -qF "<link rel=\"canonical\" href=\"$site/$page\">" <<<"$html" \
                              || { problem="/$page does not name $site/$page as its canonical URL"; return 1; }
                      done
                      get sitemap.xml | grep -qF "<loc>$site/r/button/</loc>" || { problem="sitemap.xml does not list $site/r/button/"; return 1; }
                      get llms.txt | grep -qF "($site/r/button.md)" || { problem="llms.txt does not link $site/r/button.md"; return 1; }
                      get r/button.md | grep -q '^# Button' || { problem='r/button.md does not answer the recipe'"'"'s Markdown'; return 1; }
                  }
                  for attempt in $(seq "$ATTEMPTS"); do
                      if live; then
                          echo "The deployed site at $site shows release $VERSION ($COMMIT)"
                          exit 0
                      fi
                      echo "Attempt $attempt: $problem"
                      [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$WAIT"
                  done
                  echo "::error::The deployed site at $site: $problem"
                  exit 1
