name: Pages

# The demo's showcase as a static site on GitHub Pages: the index, every recipe page and every README example in both
# themes, rendered by `bin/console app:export-static`, with the /demo application's pages. release.yml calls it once
# it has published a version; a manual run builds main, or dev as a preview of the next release (the site then shows
# dev until a release or a manual run on main deploys it again).
on:
    workflow_call:
        inputs:
            ref:
                description: The commit to build the site from
                type: string
                required: true
        secrets:
            TYPESAFE_API_KEY:
                description: The key of the advisory Jev diagnosis of a failed build; without it, the diagnosis is unavailable
                required: false
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build the site
        # a manual run only on main, or on dev as a preview (from release.yml, the event is release.yml's own)
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        timeout-minutes: 18 # 15, plus 3 for the advisory Jev step (.github/actions/jev-diagnosis)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ inputs.ref || github.sha }}
                  fetch-depth: 0 # the tags: the latest release goes in the install commands
            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: intl # the calendar formats dates with twig/intl-extra
                  tools: composer
                  coverage: none
            # the same build and checks as CI's Static site job; the install commands name the release (the output also
            # goes to $RUNNER_TEMP/jev-build.log, for the Jev step)
            # a call from release.yml builds a commit of main; a manual run builds the branch it was started on
            - name: Build and check the site
              id: build
              env:
                  BRANCH: ${{ inputs.ref && 'main' || github.ref_name }}
              run: |
                  set -o pipefail
                  tools/build-static.sh _site --base-path="/${GITHUB_REPOSITORY#*/}" --release-from-tags --branch="$BRANCH" 2>&1 | tee "$RUNNER_TEMP/jev-build.log"
            # Advisory diagnosis of a failed build (.github/actions/jev-diagnosis): never the job's verdict. Called from
            # release.yml, the run's workflow is release.yml's, so this one names itself; the key comes from the caller.
            - name: Jev diagnosis (advisory)
              if: failure()
              continue-on-error: true
              timeout-minutes: 3
              uses: ./.github/actions/jev-diagnosis
              with:
                  steps: ${{ toJSON(steps) }}
                  workflow: .github/workflows/pages.yml
                  job: Build the site
                  artifact: jev-input-pages-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    # The advisory Jev diagnosis of what the jobs above collected (.github/actions/jev-diagnosis): in a job of its own,
    # the only one given the key, running the trusted branch's tools/ci (.github/workflows/jev.yml). Nothing waits for it.
    jev:
        name: Jev
        needs: [build]
        if: ${{ !cancelled() }}
        permissions:
            contents: read
        uses: ./.github/workflows/jev.yml
        with:
            workflow: pages
        secrets:
            TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
