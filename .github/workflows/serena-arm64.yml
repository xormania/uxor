name: Serena arm64

on:
    push:
        branches: ['**']
        paths: &provider_paths
            - packages/uxor/bin/uxor-mago
            - packages/uxor/resources/mago/**
            - packages/uxor/src/Preparation/**
            - packages/uxor/dev/check-mago.py
            - .github/workflows/serena-arm64.yml
    pull_request:
        paths: *provider_paths
    workflow_dispatch:

permissions:
    contents: read

jobs:
    arm64-provider:
        name: Serena provider (Linux arm64)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: '0.13.9'
                  enable-cache: false
            - name: Build the native providers and query Serena over MCP
              run: |
                  packages/uxor/bin/uxor-mago pull
                  image=$(packages/uxor/bin/uxor-mago image serena)
                  test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/arm64
                  uv run --script packages/uxor/dev/check-mago.py
