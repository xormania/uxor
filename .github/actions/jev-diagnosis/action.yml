# What the advisory Jev (TypeSafe) diagnosis of a failed job reads, collected in one place for every job that has it
# (docs/TESTING.md, *Jev diagnosis*): the job's failed-attempts.json, its server log if any, and its name and shard,
# uploaded as an artifact (kept 3 days). The diagnosis itself runs later, in a job of its own
# (.github/workflows/jev.yml): a default-branch workflow_run consumer with the key, on a fresh runner, from the
# trusted branch's tools/ci. This step has no key
# and needs none, so no third-party code a job ran (packages, the demo's image) runs next to the key.
#
# The failed attempts come from one of:
#   attempts  a failed-attempts.json already written (the browser shards: tools/ci/playwright-summary.mjs);
#   junit     a JUnit report (tools/ci/junit-attempts.mjs: PHPUnit, or Node's junit reporter with junit-project: node);
#   steps     the caller's toJSON(steps): each step that failed the job and captured its log in
#             $RUNNER_TEMP/jev-<id>.log (tools/ci/step-attempts.mjs). No such step (the job failed elsewhere): nothing
#             is uploaded, so nothing is diagnosed.
#
# It never changes the job's verdict. The caller gives it `continue-on-error: true`, its condition (failure() or the
# job's own) and `timeout-minutes: 3`, which the job's own timeout-minutes counts; both steps continue on error. The
# artifact is named jev-input-<workflow>-<job>-<run>-<attempt>, which the independent consumer reads for that source
# run and attempt. It does not call a reusable workflow or forward a secret.
name: Jev diagnosis (advisory)
description: Collects a failed job's attempts for the advisory Jev (TypeSafe) diagnosis (jev.yml); never changes the job's verdict.
inputs:
    attempts:
        description: A failed-attempts.json to read as it is
        required: false
        default: ''
    junit:
        description: A JUnit report to turn into failed attempts
        required: false
        default: ''
    junit-project:
        description: The attempts' project for a JUnit report (junit-attempts.mjs --project; default phpunit)
        required: false
        default: ''
    steps:
        description: The caller's toJSON(steps), for the steps that captured their log in $RUNNER_TEMP/jev-<id>.log
        required: false
        default: ''
    workflow:
        description: The caller's workflow file, where step-attempts.mjs reads a step's name and command (default the run's, GITHUB_WORKFLOW_REF; a reusable workflow names its own)
        required: false
        default: ''
    server-log:
        description: A server log whose lines in each attempt's time span are evidence
        required: false
        default: ''
    compose-logs:
        description: A Compose project's directory whose php service log (docker compose logs --timestamps) is the server log
        required: false
        default: ''
    job:
        description: The job's name in the assessments (jev-diagnosis.mjs --job; default "Demo + Playwright (<shard>)")
        required: false
        default: ''
    shard:
        description: The shard, for the summary's heading (SHARD)
        required: false
        default: ''
    dir:
        description: The working directory, uploaded as the artifact (default $RUNNER_TEMP/jev)
        required: false
        default: ''
    artifact:
        description: The artifact's name, jev-input-<workflow>-<job>-<run>-<attempt> (jev.yml reads the source run's inputs)
        required: true
runs:
    using: composite
    steps:
        - name: Collect for the Jev diagnosis
          id: jev
          shell: bash
          continue-on-error: true
          env:
              JEV_DIR: ${{ inputs.dir }}
              JEV_ATTEMPTS: ${{ inputs.attempts }}
              JEV_JUNIT: ${{ inputs.junit }}
              JEV_JUNIT_PROJECT: ${{ inputs.junit-project }}
              JEV_STEPS: ${{ inputs.steps }}
              JEV_WORKFLOW: ${{ inputs.workflow }}
              JEV_SERVER_LOG: ${{ inputs.server-log }}
              JEV_COMPOSE: ${{ inputs.compose-logs }}
              JEV_JOB: ${{ inputs.job }}
              JEV_SHARD: ${{ inputs.shard }}
          run: |
              JEV_DIR=${JEV_DIR:-$RUNNER_TEMP/jev}
              echo "dir=$JEV_DIR" >> "$GITHUB_OUTPUT"
              mkdir -p "$JEV_DIR"
              attempts=$JEV_DIR/failed-attempts.json
              if [ -n "$JEV_ATTEMPTS" ]; then
                  cp "$JEV_ATTEMPTS" "$attempts"
              elif [ -n "$JEV_JUNIT" ]; then
                  node tools/ci/junit-attempts.mjs "$JEV_JUNIT" "$attempts" ${JEV_JUNIT_PROJECT:+--project "$JEV_JUNIT_PROJECT"}
              elif [ -n "$JEV_STEPS" ]; then
                  node tools/ci/step-attempts.mjs --steps "$JEV_STEPS" --logs "$RUNNER_TEMP" ${JEV_WORKFLOW:+--workflow "$JEV_WORKFLOW"} "$attempts"
                  if [ "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).attempts.length' "$attempts")" = 0 ]; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      echo "No step that failed the job captured its log: nothing for Jev to diagnose"
                      exit 0
                  fi
              else
                  echo "::warning::jev-diagnosis: give it attempts, junit or steps"
                  exit 1
              fi
              if [ -n "$JEV_COMPOSE" ]; then
                  (cd "$JEV_COMPOSE" && timeout 15 docker compose logs --no-color --timestamps php > "$JEV_DIR/server.log" 2>/dev/null) || true
              elif [ -n "$JEV_SERVER_LOG" ] && [ -f "$JEV_SERVER_LOG" ]; then
                  cp "$JEV_SERVER_LOG" "$JEV_DIR/server.log"
              fi
              # what jev.yml passes to tools/ci/jev-diagnosis.mjs: --job, and SHARD for the summary's heading
              jq -n --arg job "$JEV_JOB" --arg shard "$JEV_SHARD" '{job: $job, shard: $shard}' > "$JEV_DIR/meta.json"

        # The attempts, the server log and meta.json, for the workflow's Jev job; short-lived, the assessments are kept
        - if: ${{ always() && steps.jev.outcome == 'success' && steps.jev.outputs.skip != 'true' }}
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          continue-on-error: true
          with:
              name: ${{ inputs.artifact }}
              path: |
                  ${{ steps.jev.outputs.dir }}/failed-attempts.json
                  ${{ steps.jev.outputs.dir }}/server.log
                  ${{ steps.jev.outputs.dir }}/meta.json
              if-no-files-found: warn
              retention-days: 3
