# Weekly update pull requests, one per ecosystem: the GitHub Actions (pinned by commit, with the version in a comment),
# the npm packages of the Playwright tests, the Composer package's development lock file (composer.lock, which the
# Package job installs; users resolve composer.json's ranges themselves), the demo's lock file (demo/composer.lock),
# the consumer harness (Composer in packages/uxor/dev/app, npm browser checks in packages/uxor/dev) as well as the CI
# analyzers (Composer in tools/ci/phpstan) and the base images of the demo, the development PHP image and the Mago
# images (their Dockerfiles, pinned by digest: a new digest for the same tag, or a newer tag), against `dev` like any
# pull request. CI runs on each; nothing merges on its own.
# Refresh image pins owns the version-matched Playwright image and browser pins.
# Its daily discovery starts before the routine weekly Dependabot checks. Browser screenshot upgrades stay reviewed.
version: 2
updates:
    - package-ecosystem: github-actions
      # the workflows, and the composite action they share (its upload-artifact pin)
      directories: [/, /.github/actions/jev-diagnosis]
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: ci
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      ignore:
          # pinned to the version of the browser image in which the screenshot baselines are compared
          # (docs/NOTES.md): bump it by hand, with `node tools/playwright-image.mjs --refresh` and the baselines
          - dependency-name: '@playwright/test'
      groups:
          npm:
              patterns: ['*']

    # Refresh image pins updates playwright-core, the consumer client and the Docker image together.
    - package-ecosystem: npm
      directory: /packages/uxor/resources/browser
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      ignore:
          - dependency-name: playwright-core

    # Refresh image pins owns the Playwright client here; Dependabot handles other consumer dependencies.
    - package-ecosystem: npm
      directory: /packages/uxor/dev
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      ignore:
          - dependency-name: '@playwright/test'
      groups:
          consumer-npm:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      groups:
          composer:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /website
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      groups:
          website-composer:
              patterns: ['*']

    # the demo's lock file (demo/composer.lock: the Symfony and UX packages the recipes install, and the PHP test
    # tools), which the weekly audit reads
    - package-ecosystem: composer
      directory: /demo
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      groups:
          demo-composer:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /packages/uxor/dev/app
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      groups:
          consumer-composer:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /tools/ci/phpstan
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: ci
      groups:
          phpstan:
              patterns: ['*']

    - package-ecosystem: docker
      directories: [/demo, /packages/uxor/dev/images/php, /packages/uxor/resources/mago,
          /packages/uxor/resources/mago/serena]
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '08:47'
          timezone: UTC
      commit-message:
          prefix: chore
      groups:
          docker:
              patterns: ['*']
