# Weekly update pull requests, one per ecosystem: the GitHub Actions (pinned by commit, with the version in a comment),
# the npm packages of the Playwright tests, the Composer package's development lock file (composer.lock, which the
# Package job installs; users resolve composer.json's ranges themselves) and the demo's base images (demo/Dockerfile,
# pinned by digest: a new digest for the same tag, or a newer tag), against `dev` like any pull request. CI runs on
# each; nothing merges on its own.
# The browser image is not here: its tag follows @playwright/test (tools/playwright-image.json, docs/NOTES.md).
version: 2
updates:
    - package-ecosystem: github-actions
      # the workflows, and the composite action they share (its upload-artifact pin)
      directories: [/, /.github/actions/jev-diagnosis]
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
      ignore:
          # pinned to the version of the browser image in which the screenshot baselines are compared
          # (docs/NOTES.md): bump it by hand, with `node tools/playwright-image.mjs --refresh` and the baselines
          - dependency-name: '@playwright/test'
      groups:
          npm:
              patterns: ['*']

    - package-ecosystem: composer
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
      groups:
          composer:
              patterns: ['*']

    - package-ecosystem: docker
      directory: /demo
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
      groups:
          docker:
              patterns: ['*']
